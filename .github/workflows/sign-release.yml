name: Legacy Sign Release APK — compatibility only

on:
  workflow_dispatch:
    inputs:
      allow_compat_artifact:
        description: "Build a signed compatibility artifact only; cannot publish official GitHub Release"
        type: boolean
        default: false
      run_native_checks:
        description: "Run canonical native CMake/NDK checks through android-ci.yml"
        type: boolean
        default: true
      log_level:
        description: "Gradle log level passed to android-ci.yml"
        type: choice
        default: lifecycle
        options: [lifecycle, info, debug]

permissions:
  contents: read

concurrency:
  group: legacy-sign-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  legacy-publication-block:
    name: Block official publication from legacy workflow
    runs-on: ubuntu-latest
    steps:
      - name: Declare legacy-only release policy
        shell: bash
        run: |
          set -euo pipefail
          cat <<'MSG'
          sign-release.yml is legacy/compatibility only.
          Official signed release publication is blocked here by policy.
          Signing secrets in this compatibility path are inherited by android-ci.yml
          only through the canonical VECTRAS_RELEASE_* contract; RELEASE_* and
          ANDROID_* signing namespaces are not configured in this workflow.
          Use .github/workflows/release-dual-track.yml, which delegates build/signing
          to .github/workflows/android-ci.yml and is the only workflow allowed to
          publish official release artifacts.
          MSG
          if [[ "${{ inputs.allow_compat_artifact }}" != "true" ]]; then
            echo "::error::Set allow_compat_artifact=true only when a non-official compatibility artifact is required."
            exit 1
          fi

  signed-compat-artifact:
    name: Signed compatibility artifact (no official publication)
    needs: legacy-publication-block
    uses: ./.github/workflows/android-ci.yml
    permissions:
      contents: read
    with:
      ci_lane: release-signed-official-arm32-arm64
      run_workfile: release_gate
      build_variant: release
      signing_mode: signed
      abi_profile: official_arm32_arm64
      native_matrix_profile: canonical
      run_lint: true
      run_native_checks: ${{ inputs.run_native_checks }}
      log_level: ${{ inputs.log_level }}
    secrets: inherit

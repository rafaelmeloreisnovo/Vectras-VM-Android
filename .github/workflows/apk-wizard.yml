name: APK Wizard

on:
  workflow_dispatch:
  push:
    branches: [ master, main, develop ]
  pull_request:
    branches: [ master, main, develop ]

permissions:
  contents: read

jobs:
  build-apk-wizard:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve Java baseline
        id: java
        shell: bash
        run: |
          set -euo pipefail
          java_version="$(awk -F= '$1=="java.language.version" {gsub(/[[:space:]]/, "", $2); print $2; exit}' gradle.properties)"
          if [[ -z "${java_version}" ]]; then
            echo "java.language.version not found in gradle.properties" >&2
            exit 1
          fi
          echo "version=${java_version}" >> "$GITHUB_OUTPUT"

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ steps.java.outputs.version }}

      - name: Setup Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: ''

      - name: Install pinned Android native toolchain
        run: bash tools/ci/install_android_native_toolchain.sh

      - name: Validate APK-local bootstrap normalization contracts
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile \
            tools/bootstrap/normalize_bootstrap_tar_layout.py \
            tools/bootstrap/normalize_rootfs_tar_symlinks.py \
            tools/bootstrap/materialize_embedded_runtime_seed_assets.py \
            tools/ci/run_apk_wizard_with_transient_retry.py
          python3 tests/test_normalize_bootstrap_tar_layout.py
          python3 tests/test_normalize_rootfs_tar_symlinks.py
          python3 tests/test_apk_wizard_transient_retry.py
          python3 -m unittest discover -s tests -p 'test_package_apk_wizard_abis.py' -v

      - name: Shell-loader smoke build
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew --no-daemon :shell-loader:assembleDebug \
            -PdevFastPath=true \
            -PCI_INTERNAL_VALIDATION=false
          echo "[smoke] :shell-loader:assembleDebug OK"

      - name: Build APK wizard lanes (arm64 and arm32+arm64)
        shell: bash
        run: |
          python3 tools/ci/run_apk_wizard_with_transient_retry.py \
            --attempts 4 \
            --base-backoff-seconds 1 \
            -- ./tools/ci/build_apk_wizard.sh

      # Packaging runs only after all three APK builds and their runtime receipts pass.
      # The previous best-effort monolithic upload is replaced by fail-closed ABI ZIPs.
      - name: Verify and package APKs into architecture ZIPs
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/ci/package_apk_wizard_abis.py \
            --input-dir artifacts/apk-wizard \
            --output-dir artifacts/apk-wizard/packages \
            --source-commit "$GITHUB_SHA"

      - name: Upload ARM64 APK ZIP
        uses: actions/upload-artifact@v4
        with:
          name: vectras-debug-arm64-v8a
          path: artifacts/apk-wizard/packages/vectras-debug-arm64-v8a.zip
          if-no-files-found: error
          compression-level: 0

      - name: Upload ARM32 APK ZIP
        uses: actions/upload-artifact@v4
        with:
          name: vectras-debug-armeabi-v7a
          path: artifacts/apk-wizard/packages/vectras-debug-armeabi-v7a.zip
          if-no-files-found: error
          compression-level: 0

      - name: Upload dual-ARM APK ZIP
        uses: actions/upload-artifact@v4
        with:
          name: vectras-debug-arm32-arm64
          path: artifacts/apk-wizard/packages/vectras-debug-arm32-arm64.zip
          if-no-files-found: error
          compression-level: 0

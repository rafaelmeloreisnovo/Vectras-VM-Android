name: RAFCODE freestanding license-separated core
on:
  pull_request:
    paths:
      - 'rafcode/freestanding/**'
      - '.github/workflows/rafcode-freestanding-core.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  core-no-libc:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Compile, test and audit symbol closure
        env:
          CC: ${{ matrix.compiler }}
          RAF_CROSS_CHECK: ${{ matrix.compiler == 'clang' && '1' || '0' }}
        run: |
          sh rafcode/freestanding/ci/check.sh
          sh rafcode/freestanding/ci/check_bitops.sh
          sh rafcode/freestanding/ci/check_opt_hint.sh
          sh rafcode/freestanding/ci/check_opt_codegen.sh

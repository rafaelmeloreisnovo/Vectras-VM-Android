name: release-dual-track

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      official_release:
        description: "Executa trilha oficial assinada (requer secrets VECTRAS_RELEASE_*)"
        type: boolean
        default: true
      publish_github_release:
        description: "Publica GitHub Release somente após trilha assinada oficial verde"
        type: boolean
        default: true
      release_tag:
        description: "Tag v*.*.* a publicar quando acionado manualmente com publish_github_release=true"
        type: string
        required: false
        default: ""
      run_native_checks:
        description: "Executar matriz nativa CMake/NDK"
        type: boolean
        default: true
      log_level:
        description: "Nível de log Gradle"
        type: choice
        default: lifecycle
        options: [lifecycle, info, debug]

permissions:
  contents: read

concurrency:
  group: release-dual-track-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-unsigned-internal:
    name: Release unsigned internal (arm32+arm64)
    uses: ./.github/workflows/android-ci.yml
    permissions:
      contents: read
    with:
      ci_lane: release-unsigned-internal
      run_workfile: release_gate
      build_variant: release
      signing_mode: unsigned
      abi_profile: internal_arm32_arm64
      native_matrix_profile: canonical
      run_lint: true
      run_native_checks: ${{ github.event_name != 'workflow_dispatch' || inputs.run_native_checks }}
      log_level: ${{ github.event_name == 'workflow_dispatch' && inputs.log_level || 'lifecycle' }}
    secrets: inherit

  release-signed-official:
    name: Release signed official (arm32+arm64 compatibility)
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.official_release }}
    uses: ./.github/workflows/android-ci.yml
    permissions:
      contents: read
    with:
      ci_lane: release-signed-official-arm32-arm64
      run_workfile: release_gate
      build_variant: release
      signing_mode: signed
      abi_profile: official_arm32_arm64
      native_matrix_profile: canonical
      run_lint: true
      run_native_checks: ${{ github.event_name != 'workflow_dispatch' || inputs.run_native_checks }}
      log_level: ${{ github.event_name == 'workflow_dispatch' && inputs.log_level || 'lifecycle' }}
    secrets: inherit

  release-dual-gate:
    name: Release dual gate
    runs-on: ubuntu-latest
    if: always()
    needs: [release-unsigned-internal, release-signed-official]
    steps:
      - name: Validate unsigned lane
        shell: bash
        run: |
          set -euo pipefail
          [[ "${{ needs.release-unsigned-internal.result }}" == "success" ]]

      - name: Validate signed lane when enabled
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.official_release }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "${{ needs.release-signed-official.result }}" == "success" ]]

  publish-official-release:
    name: Publish official GitHub Release
    runs-on: ubuntu-latest
    needs: [release-dual-gate, release-signed-official]
    if: ${{ needs.release-signed-official.result == 'success' && (startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && inputs.publish_github_release)) }}
    permissions:
      contents: write
    steps:
      - name: Validate manual publish tag
        if: ${{ github.event_name == 'workflow_dispatch' }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${{ inputs.release_tag }}" ]]; then
            echo "::error::Manual official publication requires release_tag (for example v1.2.3)."
            exit 1
          fi
          if [[ ! "${{ inputs.release_tag }}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+ ]]; then
            echo "::error::release_tag must start with vMAJOR.MINOR.PATCH."
            exit 1
          fi

      - name: Download signed official Android artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: android-artifacts-release-signed-official-arm32-arm64
          path: release-assets/signed-official
          merge-multiple: true

      - name: Select releasable APK/AAB files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-assets/upload
          find release-assets/signed-official -type f \
            \( -name '*.apk' -o -name '*.aab' -o -name 'artifact-manifest.json' -o -name 'artifact-manifest.md' \) \
            -print -exec cp -a {} release-assets/upload/ \;
          file_count="$(find release-assets/upload -type f \( -name '*.apk' -o -name '*.aab' \) | wc -l | tr -d ' ')"
          if [[ "${file_count}" == "0" ]]; then
            echo "::error::No signed official APK/AAB files found to publish."
            exit 1
          fi

      - name: Create GitHub release from official signed artifacts
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || inputs.release_tag }}
          files: release-assets/upload/*
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref_name, '-beta') || contains(github.ref_name, '-rc') }}

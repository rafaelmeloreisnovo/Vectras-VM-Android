name: Android CI

on:
  workflow_call:
    inputs:
      ci_lane:
        type: string
        default: auto
      run_workfile:
        type: string
        default: smoke_debug
      build_variant:
        type: string
        default: debug
      signing_mode:
        type: string
        default: auto
      abi_profile:
        type: string
        default: official_arm64
      native_matrix_profile:
        type: string
        default: canonical
      log_level:
        type: string
        default: lifecycle
      run_lint:
        type: boolean
        default: true
      run_native_checks:
        type: boolean
        default: false

env:
  GRADLE_OPTS: "-Xmx4g -Dfile.encoding=UTF-8"
  CI: true

permissions:
  contents: read

concurrency:
  group: android-ci-canonical-${{ github.ref }}-${{ github.workflow }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  resolve:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      gradle_tasks: ${{ steps.flags.outputs.gradle_tasks }}
      artifact_variants: ${{ steps.flags.outputs.artifact_variants }}
      expect_app_artifacts: ${{ steps.flags.outputs.expect_app_artifacts }}
      signing_mode_effective: ${{ steps.flags.outputs.signing_mode_effective }}
      app_abi_policy: ${{ steps.flags.outputs.app_abi_policy }}
      supported_abis: ${{ steps.flags.outputs.supported_abis }}
      ci_internal_validation: ${{ steps.flags.outputs.ci_internal_validation }}
      native_matrix_specs: ${{ steps.flags.outputs.native_matrix_specs }}
      native_matrix_profile: ${{ steps.flags.outputs.native_matrix_profile }}
      abi_profile: ${{ steps.flags.outputs.abi_profile }}
      lane: ${{ steps.flags.outputs.lane }}
      lane_label: ${{ steps.flags.outputs.lane_label }}
      expect_perf_results: ${{ steps.flags.outputs.expect_perf_results }}
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - id: flags
        shell: bash
        run: |
          set -euo pipefail

          ci_lane="${{ inputs.ci_lane || 'auto' }}"
          run_workfile="${{ inputs.run_workfile || 'smoke_debug' }}"
          build_variant="${{ inputs.build_variant || 'debug' }}"
          signing_mode="${{ inputs.signing_mode || 'auto' }}"
          abi_profile="${{ inputs.abi_profile || 'official_arm64' }}"
          native_matrix_profile="${{ inputs.native_matrix_profile || 'canonical' }}"
          allowed_abi_profiles="$(python3 -c 'import json; from pathlib import Path; c=json.loads(Path("tools/ci/abi_profiles_contract.json").read_text()); print(" ".join(c["profiles"].keys()))')"

          case "${ci_lane}" in
            auto)
              ;;
            debug-local)
              run_workfile="upstream-debug-compat"
              build_variant="debug"
              signing_mode="unsigned"
              abi_profile="official_arm32_arm64"
              ;;
            debug-internal-arm32-arm64)
              run_workfile="compat_matrix_debug"
              build_variant="debug"
              signing_mode="unsigned"
              abi_profile="internal_arm32_arm64"
              ;;
            release-unsigned-internal)
              run_workfile="release_gate"
              build_variant="release"
              signing_mode="unsigned"
              abi_profile="internal_arm32_arm64"
              ;;
            release-signed-official)
              run_workfile="release_gate"
              build_variant="release"
              signing_mode="signed"
              abi_profile="official_arm64"
              ;;
            release-signed-official-arm32-arm64)
              run_workfile="release_gate"
              build_variant="release"
              signing_mode="signed"
              abi_profile="official_arm32_arm64"
              ;;
            *)
              echo "ci_lane inválida: ${ci_lane}" >&2
              exit 1
              ;;
          esac

          if [[ ! " ${allowed_abi_profiles} " =~ [[:space:]]${abi_profile}[[:space:]] ]]; then
            echo "abi_profile inválido para Android CI: ${abi_profile}" >&2
            exit 1
          fi


          if [[ "${ci_lane}" == "release-signed-official" && "${abi_profile}" != "official_arm64" ]]; then
            echo "release-signed-official must resolve to abi_profile=official_arm64; got ${abi_profile}" >&2
            exit 1
          fi

          if [[ "${ci_lane}" == "release-signed-official-arm32-arm64" && "${abi_profile}" != "official_arm32_arm64" ]]; then
            echo "release-signed-official-arm32-arm64 must resolve to abi_profile=official_arm32_arm64; got ${abi_profile}" >&2
            exit 1
          fi

          case "${run_workfile}" in
            smoke_debug)
              gradle_tasks=":app:assembleDebug"
              expect_app_artifacts=true
              ;;
            unit_loader)
              gradle_tasks=":shell-loader:testDebugUnitTest"
              expect_app_artifacts=false
              ;;
            full_debug)
              gradle_tasks=":app:assembleDebug :app:testDebugUnitTest :terminal-emulator:testDebugUnitTest :shell-loader:testDebugUnitTest"
              expect_app_artifacts=true
              ;;
            compat_matrix_debug|upstream-debug-compat)
              gradle_tasks=":app:checkNativeExtendedMatrix :app:assembleDebug :app:testDebugUnitTest :terminal-emulator:testDebugUnitTest :shell-loader:testDebugUnitTest"
              expect_app_artifacts=true
              ;;
            release_gate)
              gradle_tasks=":app:assembleRelease :app:testReleaseUnitTest :shell-loader:testReleaseUnitTest"
              expect_app_artifacts=true
              ;;
            *)
              echo "run_workfile inválido: ${run_workfile}" >&2
              exit 1
              ;;
          esac
          expect_perf_results=false

          case "${build_variant}" in
            debug) artifact_variants="debug" ;;
            release) artifact_variants="release" ;;
            both) artifact_variants="debug,release" ;;
            *) echo "build_variant inválido: ${build_variant}" >&2; exit 1 ;;
          esac

          eval "$(python3 ./tools/ci/resolve_abi_profile.py --profile "${abi_profile}" --allow-generic-fallback)"

          signing_mode_effective="${signing_mode}"

          case "${native_matrix_profile}" in
            canonical)
              native_matrix_specs="26:arm64-v8a"
              ;;
            pilot_android9_16_5arch)
              native_matrix_specs="28:armeabi-v7a arm64-v8a x86 x86_64;35:riscv64"
              ;;
            android8_16plus_allarch)
              native_matrix_specs="26:armeabi-v7a arm64-v8a x86 x86_64;28:armeabi-v7a arm64-v8a x86 x86_64;35:riscv64"
              ;;
            universal_hardening)
              native_matrix_specs="26:armeabi-v7a arm64-v8a x86 x86_64;28:armeabi-v7a arm64-v8a x86 x86_64;35:riscv64"
              ;;
            *)
              echo "native_matrix_profile inválido: ${native_matrix_profile}." >&2
              exit 1
              ;;
          esac

          echo "gradle_tasks=${gradle_tasks}" >> "$GITHUB_OUTPUT"
          echo "artifact_variants=${artifact_variants}" >> "$GITHUB_OUTPUT"
          echo "expect_app_artifacts=${expect_app_artifacts}" >> "$GITHUB_OUTPUT"
          echo "signing_mode_effective=${signing_mode_effective}" >> "$GITHUB_OUTPUT"
          echo "app_abi_policy=${app_abi_policy}" >> "$GITHUB_OUTPUT"
          echo "supported_abis=${supported_abis}" >> "$GITHUB_OUTPUT"
          echo "ci_internal_validation=${ci_internal_validation}" >> "$GITHUB_OUTPUT"
          echo "native_matrix_specs=${native_matrix_specs}" >> "$GITHUB_OUTPUT"
          echo "native_matrix_profile=${native_matrix_profile}" >> "$GITHUB_OUTPUT"
          lane="${ci_lane}"
          if [[ "${lane}" == "auto" ]]; then
            lane="${abi_profile}"
          fi
          lane_label="$(printf '%s' "${lane}" | tr '[:upper:]' '[:lower:]' | tr -cs 'a-z0-9._-' '-')"
          echo "abi_profile=${abi_profile}" >> "$GITHUB_OUTPUT"
          echo "lane=${lane}" >> "$GITHUB_OUTPUT"
          echo "lane_label=${lane_label}" >> "$GITHUB_OUTPUT"
          echo "expect_perf_results=${expect_perf_results}" >> "$GITHUB_OUTPUT"


  abi-contract-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    needs: resolve
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - name: Validate lowlevel ABI contract (mandatory gate)
        run: ./tools/ci/validate_lowlevel_abi.sh

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
    needs: [resolve, abi-contract-gate]
    env:
      VECTRAS_RELEASE_STORE_FILE: ${{ secrets.VECTRAS_RELEASE_STORE_FILE }}
      VECTRAS_RELEASE_STORE_PASSWORD: ${{ secrets.VECTRAS_RELEASE_STORE_PASSWORD }}
      VECTRAS_RELEASE_KEY_ALIAS: ${{ secrets.VECTRAS_RELEASE_KEY_ALIAS }}
      VECTRAS_RELEASE_KEY_PASSWORD: ${{ secrets.VECTRAS_RELEASE_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Resolve canonical build versions
        shell: bash
        run: |
          set -euo pipefail
          declare -A key_map=(
            ["compile.api"]="COMPILE_API"
            ["target.api"]="TARGET_API"
            ["min.api"]="MIN_API"
            ["tools.version"]="TOOLS_VERSION"
            ["ndk.version"]="NDK_VERSION"
            ["cmake.version"]="CMAKE_VERSION"
            ["java.language.version"]="JAVA_VERSION"
          )
          for key in "${!key_map[@]}"; do
            env_key="${key_map[$key]}"
            value="$(awk -F= -v key="$key" '$1==key {print $2; exit}' gradle.properties | tr -d '[:space:]')"
            if [[ -z "${value}" ]]; then
              echo "Missing '${key}' in gradle.properties" >&2
              exit 1
            fi
            echo "${env_key}=${value}" >> "$GITHUB_ENV"
          done

      - name: Validate Android pipeline directories
        run: ./tools/ci/validate_pipeline_directories.sh --profile android

      - name: Validate external integration sources (androidx_RmR/qemu_rafaelia)
        run: ./tools/ci/verify_external_sources.sh --check-remote

      - name: Validate Java source contracts
        run: python3 ./tools/ci/check_java_contracts.py


      - name: Validate Android SDK/build path alignment
        run: ./tools/ci/validate_android_sdk_alignment.sh

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK, Build-Tools, CMake and NDK
        shell: bash
        run: |
          set -euo pipefail
          set +o pipefail
          yes | sdkmanager --licenses >/dev/null
          set -o pipefail
          sdkmanager "platform-tools" "platforms;android-${COMPILE_API}" "build-tools;${TOOLS_VERSION}" "cmake;${CMAKE_VERSION}" "ndk;${NDK_VERSION}"

      - name: Bootstrap Android environment contract
        shell: bash
        run: |
          set -euo pipefail
          ./tools/ci/prepare_android_env.sh --java-version "${JAVA_VERSION}" --ndk-version "${NDK_VERSION}" --require-sdkmanager
          ./tools/ci/verify_android_local_properties_contract.sh

      - name: Enforce bootstrap assets contract (strict)
        if: ${{ needs.resolve.outputs.expect_app_artifacts == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          ./tools/gradle_with_jdk21.sh \
            :app:verifyShellLoaderArtifact \
            -PAPP_ABI_POLICY="${{ needs.resolve.outputs.app_abi_policy }}" \
            -PSUPPORTED_ABIS="${{ needs.resolve.outputs.supported_abis }}" \
            -PCI_INTERNAL_VALIDATION="${{ needs.resolve.outputs.ci_internal_validation }}"
          ./tools/ci/verify_bootstrap_contract.sh \
            --strict \
            -PAPP_ABI_POLICY="${{ needs.resolve.outputs.app_abi_policy }}" \
            -PSUPPORTED_ABIS="${{ needs.resolve.outputs.supported_abis }}" \
            -PCI_INTERNAL_VALIDATION="${{ needs.resolve.outputs.ci_internal_validation }}"


      - name: Resolve release signing contract
        id: signing
        if: ${{ contains(needs.resolve.outputs.artifact_variants, 'release') }}
        shell: bash
        env:
          VECTRAS_RELEASE_KEYSTORE_B64: ${{ secrets.VECTRAS_RELEASE_KEYSTORE_B64 }}
          VECTRAS_RELEASE_STORE_PASSWORD: ${{ secrets.VECTRAS_RELEASE_STORE_PASSWORD }}
          VECTRAS_RELEASE_KEY_ALIAS: ${{ secrets.VECTRAS_RELEASE_KEY_ALIAS }}
          VECTRAS_RELEASE_KEY_PASSWORD: ${{ secrets.VECTRAS_RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          ./tools/ci/prepare_release_signing.sh --mode "${{ needs.resolve.outputs.signing_mode_effective }}"

      - name: Build selected Android workfile
        shell: bash
        run: |
          set -euo pipefail
          effective_signing_mode="${{ needs.resolve.outputs.signing_mode_effective }}"
          signed_ready="${{ steps.signing.outputs.signed_ready }}"
          release_flags_str="${{ steps.signing.outputs.release_flags }}"
          signing_args_str="${{ steps.signing.outputs.signing_args }}"
          if [[ -z "${signed_ready}" ]]; then
            signed_ready="false"
          fi
          if [[ "${effective_signing_mode}" == "auto" ]]; then
            if [[ "${signed_ready}" == "true" ]]; then
              effective_signing_mode="signed"
            else
              effective_signing_mode="unsigned"
            fi
          fi
          ci_release_flag="false"
          if [[ "${effective_signing_mode}" == "signed" ]]; then
            ci_release_flag="true"
          fi
          release_flags=()
          signing_args=()
          if [[ -n "${release_flags_str}" ]]; then
            read -r -a release_flags <<< "${release_flags_str}"
          fi
          if [[ -n "${signing_args_str}" ]]; then
            read -r -a signing_args <<< "${signing_args_str}"
          fi
          ./tools/gradle_with_jdk21.sh \
            -PAPP_ABI_POLICY="${{ needs.resolve.outputs.app_abi_policy }}" \
            -PSUPPORTED_ABIS="${{ needs.resolve.outputs.supported_abis }}" \
            -PCI_INTERNAL_VALIDATION="${{ needs.resolve.outputs.ci_internal_validation }}" \
            -Psigning_mode="${effective_signing_mode}" \
            -PciRelease="${ci_release_flag}" \
            -Dorg.gradle.logging.level="${{ inputs.log_level }}" \
            "${release_flags[@]}" \
            "${signing_args[@]}" \
            ${{ needs.resolve.outputs.gradle_tasks }}

      - name: Verify Termux bootstrap ABI coverage
        if: ${{ needs.resolve.outputs.expect_app_artifacts == 'true' }}
        run: |
          set -euo pipefail
          ./tools/gradle_with_jdk21.sh :app:verifyTermuxBootstrapAbiCoverage             -PAPP_ABI_POLICY="${{ needs.resolve.outputs.app_abi_policy }}"             -PSUPPORTED_ABIS="${{ needs.resolve.outputs.supported_abis }}"             -PCI_INTERNAL_VALIDATION="${{ needs.resolve.outputs.ci_internal_validation }}"


      - name: Validate lowbasic handoff ABI matrix
        if: ${{ needs.resolve.outputs.expect_app_artifacts == 'true' }}
        run: ./tools/ci/test_lowbasic_handoff_matrix.sh
      - name: Validate critical native binary freestanding policy
        if: ${{ needs.resolve.outputs.expect_app_artifacts == 'true' }}
        run: ./tools/ci/validate_lowlevel_abi.sh --require-critical-binary

      - name: Verify delivered artifacts
        if: ${{ needs.resolve.outputs.expect_app_artifacts == 'true' }}
        run: |
          set -euo pipefail
          effective_signing_mode="${{ needs.resolve.outputs.signing_mode_effective }}"
          signed_ready="${{ steps.signing.outputs.signed_ready }}"
          if [[ -z "${signed_ready}" ]]; then
            signed_ready="false"
          fi
          if [[ "${effective_signing_mode}" == "auto" ]]; then
            if [[ "${signed_ready}" == "true" ]]; then
              effective_signing_mode="signed"
            else
              effective_signing_mode="unsigned"
            fi
          fi
          ./tools/gradle_with_jdk21.sh \
            :app:verifyDeliveredCompiledArtifacts \
            -PartifactVariants=${{ needs.resolve.outputs.artifact_variants }} \
            -Pworkflow="${{ github.workflow }}" \
            -Plane="android-ci" \
            -Pabi_profile="${{ needs.resolve.outputs.abi_profile }}" \
            -PAPP_ABI_POLICY="${{ needs.resolve.outputs.app_abi_policy }}" \
            -PSUPPORTED_ABIS="${{ needs.resolve.outputs.supported_abis }}" \
            -Psigning_mode="${effective_signing_mode}"

      - name: Generate APK ABI/bootstrap inventory report
        if: ${{ needs.resolve.outputs.expect_app_artifacts == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          apk_path="$(find app/build/outputs/apk -type f -name "*.apk" | head -n1)"
          python3 tools/ci/generate_apk_abi_bootstrap_inventory.py --apk "${apk_path}" --out reports/APK_ABI_BOOTSTRAP_INVENTORY.md

      - name: Run lint
        if: inputs.run_lint
        run: ./tools/gradle_with_jdk21.sh :app:lintDebug --continue

      - name: Run native CMake matrix checks
        if: inputs.run_native_checks
        shell: bash
        run: |
          set -euo pipefail
          matrix_specs="${{ needs.resolve.outputs.native_matrix_specs }}"
          IFS=';' read -r -a matrix_entries <<< "${matrix_specs}"
          append_flag=""
          for entry in "${matrix_entries[@]}"; do
            [[ -n "${entry}" ]] || continue
            min_api="${entry%%:*}"
            abis="${entry#*:}"
            ./tools/ci/build_android_cmake_matrix.sh \
              --sdk "${ANDROID_SDK_ROOT}" \
              --ndk-version "${NDK_VERSION}" \
              --cmake-version "${CMAKE_VERSION}" \
              --min-api "${min_api}" \
              --abis "${abis}" \
              ${append_flag}
            append_flag="--append-artifacts"
          done

      - name: Collect Android CI artifacts by lane
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          lane="${{ needs.resolve.outputs.lane }}"
          perf_runs="$(python3 tools/perf/resolve_contract.py --require-consistency | python3 -c 'import json,sys; print(json.load(sys.stdin)[\"perf_runs\"])')"
          rm -rf ci-artifacts/android-logs ci-artifacts/android-artifacts ci-artifacts/perf-results
          mkdir -p ci-artifacts/android-logs ci-artifacts/android-artifacts ci-artifacts/perf-results

          # android-logs: apenas logs textuais (Gradle/NDK/CMake) por lane.
          while IFS= read -r p; do
            rel="${p#./}"
            dst="ci-artifacts/android-logs/${rel}"
            mkdir -p "$(dirname "$dst")"
            cp -a "$p" "$dst"
          done < <(find . -type f \
            \( -name "*.log" -o -name "*.txt" -o -name "*.out" -o -name "*.err" -o -name "*.xml" -o -name "*.html" -o -name "*.json" \) \
            \( -path "*/build/reports/*" -o -path "*/build/test-results/*" -o -path "*/build/outputs/logs/*" -o -path "*/.cxx/*" \) \
            2>/dev/null | sort)

          if [[ -d app/build/outputs/apk ]]; then
            cp -a app/build/outputs/apk/. ci-artifacts/android-artifacts/
          fi
          if [[ -d app/build/outputs/bundle ]]; then
            cp -a app/build/outputs/bundle/. ci-artifacts/android-artifacts/
          fi
          # android-artifacts: pacotes + libs nativas por ABI.
          while IFS= read -r p; do
            rel="${p#./}"
            dst="ci-artifacts/android-artifacts/${rel}"
            mkdir -p "$(dirname "$dst")"
            cp -a "$p" "$dst"
          done < <(find app/build -type f \
            \( -path "*/intermediates/stripped_native_libs/*" -o -path "*/intermediates/merged_native_libs/*" -o -path "*/intermediates/merged_jni_libs/*" -o -path "*/intermediates/cmake/*" \) \
            \( -name "*.so" -o -name "*.a" \) \
            2>/dev/null | sort)

          perf_found=false
          while IFS= read -r perf_file; do
            perf_found=true
            rel="${perf_file#./}"
            dst="ci-artifacts/perf-results/${rel}"
            mkdir -p "$(dirname "$dst")"
            cp -a "$perf_file" "$dst"
          done < <(find app/build -type f \( -name '*benchmark*' -o -name '*perf*' -o -name '*profileinstaller*' \) 2>/dev/null | sort)

          perf_file_count="$(find ci-artifacts/perf-results -type f 2>/dev/null | wc -l | tr -d ' ')"
          expect_perf_results=false
          if [[ "${perf_file_count}" != "0" ]]; then
            expect_perf_results=true
          fi

          mkdir -p ci-artifacts/android-reports
          for report in reports/APK_ABI_BOOTSTRAP_INVENTORY.md reports/CANONICAL_BUILD_STATUS.md; do
            if [[ -f "$report" ]]; then
              cp -a "$report" ci-artifacts/android-reports/
            fi
          done
          if [[ -f tools/verify_bootstrap_assets.py ]]; then
            python3 tools/verify_bootstrap_assets.py > ci-artifacts/android-reports/bootstrap-assets-verification.log 2>&1 || true
          fi

          APP_ABI_POLICY="${{ needs.resolve.outputs.app_abi_policy }}" \
          SUPPORTED_ABIS="${{ needs.resolve.outputs.supported_abis }}" \
          PERF_RUNS="${perf_runs}" \
          ./tools/ci/materialize_android_ci_artifacts.sh \
            --lane "${lane}" \
            --expect-app-artifacts "${{ needs.resolve.outputs.expect_app_artifacts }}" \
            --expect-native-matrix "${{ inputs.run_native_checks }}" \
            --expect-perf-results "${perf_found}"

      - name: Generate APK report (sizes, ABIs, checksums)
        if: always()
        run: |
          ./tools/ci/collect_apk_report.sh ci-artifacts/apk-report


      - name: Upload Android logs
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-logs-${{ needs.resolve.outputs.lane_label }}
          path: ci-artifacts/upload-staging/android-logs-${{ needs.resolve.outputs.lane_label }}/**
          if-no-files-found: warn

      - name: Upload Android artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-artifacts-${{ needs.resolve.outputs.lane_label }}
          path: ci-artifacts/upload-staging/android-artifacts-${{ needs.resolve.outputs.lane_label }}/**
          if-no-files-found: warn

      - name: Upload native matrix
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-matrix-${{ needs.resolve.outputs.lane_label }}
          path: ci-artifacts/upload-staging/native-matrix-${{ needs.resolve.outputs.lane_label }}/**
          if-no-files-found: warn


      - name: Upload Android reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-reports-${{ needs.resolve.outputs.lane_label }}
          path: ci-artifacts/android-reports/**
          if-no-files-found: warn

      - name: Upload APK report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: apk-report-${{ needs.resolve.outputs.lane_label }}
          path: ci-artifacts/apk-report/**
          if-no-files-found: warn

      - name: Upload perf results
        uses: actions/upload-artifact@v4
        if: always() && hashFiles(format('ci-artifacts/upload-staging/perf-results-{0}/files/**', needs.resolve.outputs.lane_label)) != ''
        with:
          name: perf-results-${{ needs.resolve.outputs.lane_label }}
          path: ci-artifacts/upload-staging/perf-results-${{ needs.resolve.outputs.lane_label }}/**
          if-no-files-found: warn

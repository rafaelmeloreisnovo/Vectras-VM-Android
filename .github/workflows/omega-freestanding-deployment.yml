name: Omega Freestanding ARMv7 Deployment

on:
  pull_request:
    paths:
      - 'deployment/freestanding/**'
      - 'app/src/main/cpp/CMakeLists.txt'
      - 'app/src/main/cpp/lowlevel_abi.c'
      - 'app/src/main/cpp/lowlevel_abi.h'
      - 'app/src/main/cpp/vectra_ll_base.h'
      - 'app/src/debug/AndroidManifest.xml'
      - 'tools/ci/audit_omega_freestanding_deploy.py'
      - 'tools/ci/stage_omega_freestanding_apk_asset.py'
      - 'tools/ci/verify_omega_freestanding_apk.py'
      - 'tools/ci/materialize_omega_freestanding_asset.sh'
      - 'tools/ci/resolve_abi_profile.py'
      - 'tools/ci/abi_profiles_contract.json'
      - '.github/workflows/omega-freestanding-deployment.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: omega-freestanding-deployment-${{ github.ref }}
  cancel-in-progress: true

env:
  SOURCE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
  ANDROID_NDK_VERSION: 27.2.12479018
  ANDROID_CMAKE_VERSION: 3.22.1

jobs:
  armv7-deployment:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Static contract checks
        run: |
          set -euo pipefail
          python3 -m py_compile \
            tools/ci/audit_omega_freestanding_deploy.py \
            tools/ci/stage_omega_freestanding_apk_asset.py \
            tools/ci/verify_omega_freestanding_apk.py
          bash -n tools/ci/materialize_omega_freestanding_asset.sh
          python3 tools/ci/check_abi_contract_drift.py
          python3 tools/ci/resolve_abi_profile.py --profile internal_arm32_arm64 --format json

      - name: Install Android NDK and CMake
        run: |
          set -euo pipefail
          sdkmanager="${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager"
          yes | "${sdkmanager}" --licenses >/dev/null || true
          "${sdkmanager}" \
            "ndk;${ANDROID_NDK_VERSION}" \
            "cmake;${ANDROID_CMAKE_VERSION}"

      - name: Build, audit and stage ARMv7 freestanding carrier
        run: |
          set -euo pipefail
          bash tools/ci/materialize_omega_freestanding_asset.sh \
            --sdk-root "${ANDROID_SDK_ROOT}" \
            --asset-root app/build/generated/bootstrapAssets \
            --jni-root app/src/debug/jniLibs \
            --out-dir artifacts/omega-freestanding-armv7 \
            --commit "${SOURCE_COMMIT}"

      - name: Build debug APK with canonical ABI profile
        run: |
          set -euo pipefail
          eval "$(python3 tools/ci/resolve_abi_profile.py --profile internal_arm32_arm64)"
          ./tools/gradle_with_jdk21.sh :app:assembleDebug \
            -POFFICIAL_CI=false \
            -PCI_INTERNAL_VALIDATION="${ci_internal_validation}" \
            -PAPP_ABI_POLICY="${app_abi_policy}" \
            -PSUPPORTED_ABIS="${supported_abis}"

      - name: Verify native carrier identity inside APK
        run: |
          set -euo pipefail
          apk="$(find app/build/outputs/apk/debug -type f -name '*.apk' -print -quit)"
          test -n "${apk}"
          python3 tools/ci/verify_omega_freestanding_apk.py \
            --apk "${apk}" \
            --binary artifacts/omega-freestanding-armv7/omega-core-armv7.elf \
            --audit artifacts/omega-freestanding-armv7/elf-audit.json \
            --output artifacts/omega-freestanding-armv7/apk-materialization-receipt.json \
            --commit "${SOURCE_COMMIT}"
          cp "${apk}" artifacts/omega-freestanding-armv7/app-debug-omega-freestanding.apk

      - name: Preserve evidence boundary
        run: |
          cat <<'EOF' >> artifacts/omega-freestanding-armv7/boundary.txt
          APK_NATIVE_CARRIER=GATED_BY_BYTE_IDENTITY
          ANDROID10_WX=EXECUTABLE_CODE_APK_INSTALL_OWNED
          DEVICE_NATIVE_LIBRARY_DIR=TOKEN_VAZIO
          DEVICE_EXECUTION=TOKEN_VAZIO
          PHYSICAL_EXIT=TOKEN_VAZIO
          VM_BOOT=TOKEN_VAZIO
          CLAIM_ALLOWED=false
          EOF

      - name: Upload deployment evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: omega-freestanding-armv7-${{ github.sha }}
          path: artifacts/omega-freestanding-armv7/
          if-no-files-found: error

name: Omega Freestanding ARMv7 Deployment

on:
  pull_request:
    paths:
      - 'deployment/freestanding/**'
      - 'app/src/main/cpp/CMakeLists.txt'
      - 'app/src/main/cpp/lowlevel_abi.c'
      - 'app/src/main/cpp/lowlevel_abi.h'
      - 'app/src/main/cpp/vectra_ll_base.h'
      - 'tools/ci/audit_omega_freestanding_deploy.py'
      - 'tools/ci/stage_omega_freestanding_apk_asset.py'
      - 'tools/ci/verify_omega_freestanding_apk.py'
      - 'tools/ci/resolve_abi_profile.py'
      - 'tools/ci/abi_profiles_contract.json'
      - '.github/workflows/omega-freestanding-deployment.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: omega-freestanding-deployment-${{ github.ref }}
  cancel-in-progress: true

env:
  SOURCE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
  ANDROID_NDK_VERSION: 27.2.12479018
  ANDROID_CMAKE_VERSION: 3.22.1

jobs:
  armv7-deployment:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Python syntax and ABI drift contract
        run: |
          python3 -m py_compile \
            tools/ci/audit_omega_freestanding_deploy.py \
            tools/ci/stage_omega_freestanding_apk_asset.py \
            tools/ci/verify_omega_freestanding_apk.py
          python3 tools/ci/check_abi_contract_drift.py

      - name: Resolve canonical internal ARM32+ARM64 profile
        run: |
          set -euo pipefail
          python3 tools/ci/resolve_abi_profile.py --profile internal_arm32_arm64 --format json

      - name: Install Android NDK and CMake
        run: |
          set -euo pipefail
          sdkmanager="${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager"
          yes | "${sdkmanager}" --licenses >/dev/null || true
          "${sdkmanager}" \
            "ndk;${ANDROID_NDK_VERSION}" \
            "cmake;${ANDROID_CMAKE_VERSION}"

      - name: Configure dedicated ARMv7 freestanding deployment
        run: |
          set -euo pipefail
          cmake_dir="${ANDROID_SDK_ROOT}/cmake/${ANDROID_CMAKE_VERSION}"
          ndk_dir="${ANDROID_SDK_ROOT}/ndk/${ANDROID_NDK_VERSION}"
          "${cmake_dir}/bin/cmake" \
            -S deployment/freestanding \
            -B build/omega-armv7 \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_MAKE_PROGRAM="${cmake_dir}/bin/ninja" \
            -DCMAKE_TOOLCHAIN_FILE="${ndk_dir}/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=armeabi-v7a \
            -DANDROID_PLATFORM=android-29 \
            -DANDROID_STL=none

      - name: Build twice and audit freestanding ELF
        run: |
          set -euo pipefail
          cmake_dir="${ANDROID_SDK_ROOT}/cmake/${ANDROID_CMAKE_VERSION}"
          ndk_bin="${ANDROID_SDK_ROOT}/ndk/${ANDROID_NDK_VERSION}/toolchains/llvm/prebuilt/linux-x86_64/bin"
          build_dir="build/omega-armv7"
          out_dir="${build_dir}/out"
          evidence_dir="artifacts/omega-freestanding-armv7"
          elf="${out_dir}/omega-core-armv7.elf"
          map="${out_dir}/omega-core-armv7.map"
          mkdir -p "${evidence_dir}"

          "${cmake_dir}/bin/cmake" --build "${build_dir}" \
            --target omega_freestanding_deploy_armv7 \
            --verbose 2>&1 | tee "${evidence_dir}/build-first.log"
          test -f "${elf}"
          cp "${elf}" "${evidence_dir}/reference.elf"

          rm -f "${elf}" "${map}"
          "${cmake_dir}/bin/cmake" --build "${build_dir}" \
            --target omega_freestanding_deploy_armv7 \
            --verbose 2>&1 | tee "${evidence_dir}/build-second.log"
          test -f "${elf}"

          python3 tools/ci/audit_omega_freestanding_deploy.py \
            --binary "${elf}" \
            --reference-binary "${evidence_dir}/reference.elf" \
            --readelf "${ndk_bin}/llvm-readelf" \
            --output "${evidence_dir}/elf-audit.json" \
            --commit "${SOURCE_COMMIT}"

          cp "${elf}" "${evidence_dir}/omega-core-armv7.elf"
          cp "${map}" "${evidence_dir}/omega-core-armv7.map"

      - name: Stage audited ELF into generated APK assets
        run: |
          python3 tools/ci/stage_omega_freestanding_apk_asset.py \
            --binary build/omega-armv7/out/omega-core-armv7.elf \
            --audit artifacts/omega-freestanding-armv7/elf-audit.json \
            --asset-root app/build/generated/bootstrapAssets \
            --commit "${SOURCE_COMMIT}"

      - name: Build debug APK with canonical ABI profile
        run: |
          set -euo pipefail
          eval "$(python3 tools/ci/resolve_abi_profile.py --profile internal_arm32_arm64)"
          ./tools/gradle_with_jdk21.sh :app:assembleDebug \
            -POFFICIAL_CI=false \
            -PCI_INTERNAL_VALIDATION="${ci_internal_validation}" \
            -PAPP_ABI_POLICY="${app_abi_policy}" \
            -PSUPPORTED_ABIS="${supported_abis}"

      - name: Verify ELF identity inside APK
        run: |
          set -euo pipefail
          apk="$(find app/build/outputs/apk/debug -type f -name '*.apk' -print -quit)"
          test -n "${apk}"
          python3 tools/ci/verify_omega_freestanding_apk.py \
            --apk "${apk}" \
            --audit artifacts/omega-freestanding-armv7/elf-audit.json \
            --output artifacts/omega-freestanding-armv7/apk-materialization-receipt.json \
            --commit "${SOURCE_COMMIT}"
          cp "${apk}" artifacts/omega-freestanding-armv7/app-debug-omega-freestanding.apk

      - name: Preserve evidence boundary
        run: |
          cat <<'EOF' | tee artifacts/omega-freestanding-armv7/boundary.txt
          FREESTANDING_ELF_BUILD=GATED_BY_ELF_AUDIT
          APK_MATERIALIZATION=GATED_BY_BYTE_IDENTITY
          DEVICE_INSTALL=TOKEN_VAZIO
          DEVICE_EXECUTION=TOKEN_VAZIO
          PHYSICAL_EXIT=TOKEN_VAZIO
          VM_BOOT=TOKEN_VAZIO
          CLAIM_ALLOWED=false
          EOF

      - name: Upload deployment evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: omega-freestanding-armv7-${{ github.sha }}
          path: artifacts/omega-freestanding-armv7/
          if-no-files-found: error

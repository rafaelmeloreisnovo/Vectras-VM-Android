name: ZIPRAF Real Archive Binding

on:
  push:
    paths:
      - 'engine/rmr/include/rmr_zipraf_archive.h'
      - 'engine/rmr/include/rmr_zipraf_binding.h'
      - 'engine/rmr/src/rmr_zipraf_archive.c'
      - 'engine/rmr/src/rmr_zipraf_binding.c'
      - 'demo_cli/src/zipraf_archive_selftest.c'
      - 'demo_cli/src/zipraf_host_mmap_probe.c'
      - 'tools/zipraf/test_zipraf_archive_binding.sh'
      - 'engine/rmr/ZIPRAF_REAL_ARCHIVE_BINDING_V2.md'
      - '.github/workflows/zipraf-archive-binding.yml'
  pull_request:
    paths:
      - 'engine/rmr/include/rmr_zipraf_archive.h'
      - 'engine/rmr/include/rmr_zipraf_binding.h'
      - 'engine/rmr/src/rmr_zipraf_archive.c'
      - 'engine/rmr/src/rmr_zipraf_binding.c'
      - 'demo_cli/src/zipraf_archive_selftest.c'
      - 'demo_cli/src/zipraf_host_mmap_probe.c'
      - 'tools/zipraf/test_zipraf_archive_binding.sh'
      - 'engine/rmr/ZIPRAF_REAL_ARCHIVE_BINDING_V2.md'
      - '.github/workflows/zipraf-archive-binding.yml'

permissions:
  contents: read

jobs:
  real-archive-binding:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Compile KAT, inject faults and run mmap probe
        env:
          ZIPRAF_RECEIPT_PATH: zipraf-host-mmap-receipt.json
        run: sh tools/zipraf/test_zipraf_archive_binding.sh
      - name: Validate receipt JSON
        run: python -m json.tool zipraf-host-mmap-receipt.json >/dev/null
      - name: Upload bounded host receipt
        uses: actions/upload-artifact@v4
        with:
          name: zipraf-host-mmap-receipt
          path: zipraf-host-mmap-receipt.json
          if-no-files-found: error
          retention-days: 30

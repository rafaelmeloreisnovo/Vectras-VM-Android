name: QEMU Rafaelia External Smoke

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'tools/qemu/**'
      - 'tools/qemu_rafaelia_assets.lock.yml'
      - 'tools/qemu_launch.yml'
      - 'docs/qemu/**'
      - '.github/workflows/qemu-rafaelia-external-smoke.yml'

permissions:
  contents: read

jobs:
  qemu-rafaelia-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout Vectra
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            git \
            ninja-build \
            pkg-config \
            python3 \
            python3-pip \
            libglib2.0-dev \
            libpixman-1-dev \
            zlib1g-dev \
            libfdt-dev \
            libcapstone-dev \
            libslirp-dev

      - name: Build qemu_rafaelia smoke and integration tests
        env:
          QEMU_REPO_URL: https://github.com/rafaelmeloreisnovo/qemu_rafaelia.git
          QEMU_REF: master
        run: bash tools/qemu/build_qemu_rafaelia_smoke.sh

      - name: Upload qemu_rafaelia artifacts
        uses: actions/upload-artifact@v4
        with:
          name: qemu-rafaelia-smoke-${{ github.run_id }}
          path: qemu_rafaelia_artifacts/**
          if-no-files-found: warn

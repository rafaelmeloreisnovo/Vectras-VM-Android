name: host-ci

on:
  workflow_call:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: host-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  host-engine:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install host build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential cmake ninja-build make pkg-config python3 ripgrep

      - name: Block sensitive artifacts and credential patterns
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base_sha="${{ github.event.pull_request.base.sha }}"
            head_sha="${{ github.event.pull_request.head.sha }}"
            git cat-file -e "${base_sha}^{commit}"
            git cat-file -e "${head_sha}^{commit}"
            export SENSITIVE_CHECK_RANGE="${base_sha}..${head_sha}"
          elif git rev-parse --verify HEAD~1 >/dev/null 2>&1; then
            export SENSITIVE_CHECK_RANGE="HEAD~1..HEAD"
          fi
          bash tools/check_sensitive_artifacts.sh

      - name: Validate consolidated lowlevel ABI guard
        run: ./tools/ci/validate_lowlevel_abi.sh

      - name: Validate host pipeline directories
        run: ./tools/ci/validate_pipeline_directories.sh --profile host

      - name: Block duplicated overlay ZIP source
        run: bash tools/check_overlay_zip_duplicates.sh

      - name: Block firebasestorage links in web assets
        run: bash tools/check_no_firebasestorage_links.sh

      - name: Validate docs reference commit consistency
        run: bash tools/check_docs_reference_commit.sh

      - name: Validate incoming ingestion map contract
        run: ./tools/ci/check_incoming_ingestion.py

      - name: Validate artifact promotion batch 001
        run: |
          python3 tools/promotion/verify_promotion_batch.py \
            --root . \
            --batch configs/vectra_artifact_promotion_batch_001.json \
            --output reports/vectra-artifact-promotion/batch-001.json
          python3 -m json.tool reports/vectra-artifact-promotion/batch-001.json >/dev/null
          sha256sum reports/vectra-artifact-promotion/batch-001.json | tee reports/vectra-artifact-promotion/batch-001.sha256

      - name: Index compilerlowFala seeds without executing bodies
        run: |
          python3 tools/compilerlowfala/extract_seeds.py \
            --source Incluir/compiladorlowFala.txt \
            --output reports/compilerlowfala_seed_index.json \
            --require-count 60

      - name: Run artifact promotion adversarial tests
        run: python3 tests/test_vectra_artifact_promotion.py

      - name: Run Vectra capability surface gate
        run: bash tools/run_vectra_capability_gate.sh

      - name: Validate native toolchain dependencies
        run: |
          set -euo pipefail
          required_tools=(cc gcc as ld ar nm make cmake ninja python3 rg)
          for tool in "${required_tools[@]}"; do
            command -v "$tool" >/dev/null || { echo "Missing required tool: $tool" >&2; exit 1; }
            echo "OK: $tool -> $(command -v "$tool")"
          done

      - name: Show hosted engine config
        run: make print-build-config

      - name: Run VECTRA_OS contract audit
        run: make verify-vectra-os-contract

      - name: Build engine with Makefile
        run: make -j"$(nproc)"

      - name: Run engine selftests
        run: make run-selftest

      - name: Run VECTRA_OS MVP benchmark proof
        run: make run-vectra-os-mvp-bench

      - name: Gate sector reentrancy/selftest (host native)
        run: make run-sector-selftest

      - name: Run deterministic sector snapshot (42 bytes)
        run: make run-sector-snapshot-42

      - name: Run core benchmark smoke test
        run: make run-core-bench-smoke

      - name: Run ASM compiler refactor gate (integrity + failsafe)
        run: ./tools/ci/run_asm_compiler_refactor_gate.sh

      - name: Run ISO 8000/27000 + Six Sigma audit (8-point)
        run: python3 tools/ci/run_iso_sixsigma_audit.py --strict

      - name: Resolve perf runs contract
        run: |
          set -euo pipefail
          python3 tools/perf/resolve_contract.py --require-consistency --validate-workflows --github-output "$GITHUB_ENV"

      - name: Run reproducible perf suite (ABI/policy)
        run: |
          set -euo pipefail
          python3 tools/perf/run_suite.py --runs "$perf_runs"
          python3 tools/perf/compare_baseline.py --margin 0.03
          python3 tools/perf/derive_flag_decisions.py

      - name: Build engine with root CMake
        run: |
          cmake -S . -B build-cmake -G Ninja -DRMR_JNI_BUILD=ON -DRMR_ENABLE_POLICY_MODULE=ON
          cmake --build build-cmake -j"$(nproc)"

      - name: Run torus flow focused selftest (CMake artifact)
        run: ./build-cmake/rmr_torus_flow_selftest

      - name: Verify link contracts (CMake)
        run: cmake --build build-cmake --target verify_contracts

      - name: Collect and hash host evidence
        if: always()
        run: |
          set -euo pipefail
          mkdir -p artifacts/bin bench-results reports/host-ci
          find bench/results -type f \( -name '*.csv' -o -name '*.log' -o -name '*.txt' -o -name '*.json' \) -exec cp {} bench-results/ \; 2>/dev/null || true
          python3 - <<'PY'
          from pathlib import Path
          import shutil
          out = Path('artifacts/bin')
          count = 0
          for path in Path('.').rglob('*'):
              if count >= 20:
                  break
              if not path.is_file() or '.git' in path.parts or 'build-cmake' in path.parts:
                  continue
              try:
                  executable = bool(path.stat().st_mode & 0o111)
              except OSError:
                  continue
              if executable:
                  shutil.copy2(path, out / path.name)
                  count += 1
          PY
          find . -name '*.so' -not -path './build-cmake/*' -exec cp {} artifacts/bin/ \; 2>/dev/null || true
          cp -r build-cmake/bin/* artifacts/bin/ 2>/dev/null || true
          cp -r build-cmake/lib/* artifacts/bin/ 2>/dev/null || true
          cp build-cmake/rmr_torus_flow_selftest artifacts/bin/ 2>/dev/null || true
          tar -czf host-engine-artifacts.tar.gz -C artifacts .
          sha256sum host-engine-artifacts.tar.gz > reports/host-ci/host-engine-artifacts.sha256
          find reports bench-results -type f -print0 | sort -z | xargs -0 -r sha256sum > reports/host-ci/evidence-sha256.txt
          {
            echo '## Host CI evidence'
            echo
            echo '- Computational gates execute before uploads.'
            echo '- Evidence checksums are retained in the job log.'
            echo '- Artifact storage is best-effort while quota is unavailable.'
            echo
            echo '```text'
            cat reports/host-ci/host-engine-artifacts.sha256
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload host binaries (best effort)
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: host-engine-binaries-${{ github.run_id }}
          path: host-engine-artifacts.tar.gz
          if-no-files-found: warn

      - name: Upload host reports (best effort)
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: host-ci-results
          path: |
            bench-results/**
            bench/results/perf/**
            bench/results/perf/manifest.json
            bench/baseline/*.json
            reports/asm-compiler/**
            reports/iso-sixsigma/**
            reports/vectra-artifact-promotion/**
            reports/compilerlowfala_seed_index.json
            reports/vectra_capability_surface.json
            reports/host-ci/**
            build-host/rmr_build_config.env
            build-cmake/rmr_build_config.env
          if-no-files-found: warn

      - name: Upload host logs (best effort)
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: host-logs-${{ github.run_id }}
          path: |
            build
            build-cmake
            bench/results
            reports
          if-no-files-found: warn

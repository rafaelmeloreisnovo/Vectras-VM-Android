name: audit-benchmark-contract
on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
  pull_request:

jobs:
  audit-benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - name: Install deps
        run: |
          set -euo pipefail
          # GitHub's runner image includes a mutable Google Chrome APT source.
          # This job does not use Chrome; isolate benchmark bootstrap from an
          # unrelated repository whose index may be mid-publication/hash-skewed.
          sudo rm -f \
            /etc/apt/sources.list.d/google-chrome.list \
            /etc/apt/sources.list.d/google-chrome.sources
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ripgrep
      - name: Validate audit claims
        run: ./scripts/validate_audit_claims.sh
      - name: Validate benchmark 24-percent regression contract
        run: python3 ./scripts/validate_benchmark_progress_contract.py
      - name: Validate RMR equivalence
        run: ./scripts/rmr_equivalence_check.sh
      - name: Collect vectra-grade benchmarks
        run: ./scripts/collect_vectra_grade_benchmarks.sh
      - name: Upload reports
        uses: actions/upload-artifact@v4
        with:
          name: audit-benchmark-reports
          path: reports/*.{json,csv,md,txt}
          if-no-files-found: warn

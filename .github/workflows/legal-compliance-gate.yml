name: Legal Compliance Gate

on:
  push:
    paths:
      - 'engine/rmr/**'
      - 'app/src/main/jniLibs/**'
      - '_incoming/pending/**'
      - 'resources/compliance/**'
      - 'LICENSES_REGISTER.md'
      - 'legal/**'
      - 'sbom/**'
      - 'tools/qemu_rafaelia_assets.lock.yml'
      - 'tools/ci/check_legal_gate.py'
      - 'tools/ci/build_provenance_closure_report.py'
      - 'tests/test_build_provenance_closure_report.py'
      - '.github/workflows/legal-compliance-gate.yml'
  pull_request:
    paths:
      - 'engine/rmr/**'
      - 'app/src/main/jniLibs/**'
      - '_incoming/pending/**'
      - 'resources/compliance/**'
      - 'LICENSES_REGISTER.md'
      - 'legal/**'
      - 'sbom/**'
      - 'tools/qemu_rafaelia_assets.lock.yml'
      - 'tools/ci/check_legal_gate.py'
      - 'tools/ci/build_provenance_closure_report.py'
      - 'tests/test_build_provenance_closure_report.py'
      - '.github/workflows/legal-compliance-gate.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  SOURCE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
  EXPECTED_QEMU_COMMIT: d4b3ef09956fa1abaeacba61dca3965f591c3a6a

jobs:
  legal-gate:
    name: Legal / Provenance Gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python syntax and unit tests
        run: |
          python3 -m py_compile \
            tools/ci/check_legal_gate.py \
            tools/ci/build_provenance_closure_report.py
          python3 -m unittest tests/test_build_provenance_closure_report.py -v

      - name: Run existing legal compliance check
        run: python3 tools/ci/check_legal_gate.py

      - name: Verify engine/rmr SPDX coverage
        run: |
          missing=$(grep -rL "SPDX-License-Identifier" engine/rmr/src/ --include="*.c" --include="*.h" 2>/dev/null || true)
          missing_asm=$(grep -rL "SPDX-License-Identifier" engine/rmr/interop/ --include="*.S" 2>/dev/null || true)
          if [ -n "$missing" ] || [ -n "$missing_asm" ]; then
            [ -n "$missing" ] && echo "FAIL: Missing SPDX in engine/rmr/src/:" && echo "$missing"
            [ -n "$missing_asm" ] && echo "FAIL: Missing SPDX in engine/rmr/interop/:" && echo "$missing_asm"
            exit 1
          fi
          echo "OK: all engine/rmr source and interop files have SPDX headers"

      - name: Build C06 provenance closure report
        run: |
          mkdir -p artifacts/c06-provenance
          python3 tools/ci/build_provenance_closure_report.py \
            --repo . \
            --expected-qemu-commit "${EXPECTED_QEMU_COMMIT}" \
            --source-commit "${SOURCE_COMMIT}" \
            --output artifacts/c06-provenance/provenance_closure_report.json

      - name: Summarize C06 boundary
        if: always()
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          path = Path('artifacts/c06-provenance/provenance_closure_report.json')
          if not path.is_file():
              print('C06_STATE=TOKEN_VAZIO_REPORT_NOT_CREATED')
              raise SystemExit(0)
          report = json.loads(path.read_text())
          print(f"C06_STATE={report['state']}")
          print(f"REGISTER_ROWS={report['summary']['register_rows']}")
          print(f"CRITICAL_UNRESOLVED={report['summary']['critical_unresolved_rows']}")
          print(f"QEMU_PIN_MATCHES={report['qemu_pin_matches']}")
          print('PUBLIC_RELEASE_ALLOWED=false')
          print('CLAIM_ALLOWED=false')
          PY

      - name: Upload C06 provenance receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: c06-provenance-closure-${{ github.sha }}
          path: artifacts/c06-provenance/
          if-no-files-found: warn
          retention-days: 30

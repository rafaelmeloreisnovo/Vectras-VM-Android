plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.kapt'
}

import groovy.json.JsonOutput
import groovy.json.JsonSlurper
import java.security.MessageDigest
import java.util.regex.Pattern
import java.util.zip.ZipFile
import java.util.Locale

def termuxBootstrapSupportedAbis = (rootProject.ext.termuxBootstrapSupportedAbis ?: ['arm64-v8a', 'armeabi-v7a', 'x86', 'x86_64']) as List<String>
def devFastPath = providers.gradleProperty("devFastPath").orElse("false").get().toBoolean()

android {
    namespace = 'com.vectras.vm'
    compileSdk = rootProject.ext.compileApi
    buildToolsVersion = rootProject.ext.toolsVersion
    ndkVersion = rootProject.ext.ndkVersion

    defaultConfig {
        applicationId "com.rafacodephi.app"
        minSdk = rootProject.ext.minApi
        targetSdk = rootProject.ext.targetApi
        versionCode = 70
        versionName = "3.6.6"
        testInstrumentationRunner = "androidx.test.runner.AndroidJUnitRunner"
        multiDexEnabled = false

        ndk {
            abiFilters(*rootProject.ext.supportedAbis as String[])
        }

        externalNativeBuild {
            cmake {
                def rmrEnablePolicyModule = providers.gradleProperty("RMR_ENABLE_POLICY_MODULE").orElse("ON").get()
                def rmrEnableBitrafModule = providers.gradleProperty("RMR_ENABLE_BITRAF_MODULE").orElse("ON").get()
                def nativeMcpu = providers.gradleProperty("nativeMcpu").orNull
                def nativeFlagsDecisionFile = providers.gradleProperty("nativeFlagsDecisionFile").orNull
                def resolvedLtoMode = "off"
                def resolvedInlinePolicy = "default"
                if (nativeFlagsDecisionFile) {
                    def decisionFile = rootProject.file(nativeFlagsDecisionFile)
                    if (!decisionFile.exists()) {
                        throw new GradleException("nativeFlagsDecisionFile inexistente: ${decisionFile}")
                    }
                    def decisionJson = new JsonSlurper().parse(decisionFile)
                    def arm64Decision = decisionJson?.decisions?.get("arm64-v8a")
                    if (arm64Decision) {
                        def cflags = (arm64Decision.cflags ?: "").toString().trim().split("\\s+").findAll { !it.isEmpty() }
                        if (!nativeMcpu) {
                            def mcpuToken = cflags.find { it.startsWith("-mcpu=") }
                            if (mcpuToken) {
                                nativeMcpu = mcpuToken.substring("-mcpu=".length())
                            }
                        }
                        resolvedLtoMode = (arm64Decision.lto ?: "off").toString()
                        resolvedInlinePolicy = (arm64Decision.inline ?: "default").toString()
                    }
                }
                def arm64CppFlags = ["-march=armv8-a"]
                if (nativeMcpu) {
                    // -mcpu complementa o baseline de -march sem substituí-lo.
                    arm64CppFlags += "-mcpu=${nativeMcpu}"
                }
                def commonCppFlags = ["-O2", "-fno-fast-math", "-fno-exceptions", "-fno-rtti", "-DRMR_JNI_BUILD=1"]
                cppFlags commonCppFlags.join(" ")
                cFlags "-O2 -fno-fast-math -DRMR_JNI_BUILD=1"
                arguments "-DRMR_ENABLE_POLICY_MODULE=${rmrEnablePolicyModule}",
                          "-DRMR_ENABLE_BITRAF_MODULE=${rmrEnableBitrafModule}",
                          "-DVECTRA_ARM64_CPP_FLAGS=${arm64CppFlags.join(' ')}",
                          "-DVECTRA_LTO_MODE=${resolvedLtoMode}",
                          "-DVECTRA_INLINE_POLICY=${resolvedInlinePolicy}",
                          "-DTERMUX_BOOTSTRAP_SUPPORTED_ANDROID_ABIS=${termuxBootstrapSupportedAbis.join(';')}"
            }
        }

        resValue "string", "app_version", versionName
        resValue "integer", "app_version_code", versionCode.toString()
        buildConfigField "int", "VECTRA_CORE_SEED", "0"
        buildConfigField "int", "PROCESS_BUDGET_MAX_DEFAULT", "9"
        buildConfigField "int", "PROCESS_BUDGET_MAX_ANDROID15", "6"
    }

    def supportedAbis = (rootProject.ext.supportedAbis ?: []) as List<String>
    def officialAbis = (rootProject.ext.officialAbis ?: []) as List<String>
    def allowedAbis = (rootProject.ext.allowedAbis ?: officialAbis) as List<String>
    def allKnownAndroidAbis = ['arm64-v8a', 'armeabi-v7a', 'x86', 'x86_64', 'riscv64']

    if (!supportedAbis.every { it in allowedAbis }) {
        throw new GradleException("supportedAbis (${supportedAbis}) precisa permanecer coerente com a matriz permitida (${allowedAbis}).")
    }

    packaging {
        jniLibs {
            excludes += allKnownAndroidAbis
                .findAll { !(it in supportedAbis) }
                .collect { "lib/${it}/**" }
        }
    }

    def releaseStoreFile = providers.gradleProperty("android.injected.signing.store.file").orNull ?: System.getenv("VECTRAS_RELEASE_STORE_FILE")
    def releaseStorePassword = providers.gradleProperty("android.injected.signing.store.password").orNull ?: System.getenv("VECTRAS_RELEASE_STORE_PASSWORD")
    def releaseKeyAlias = providers.gradleProperty("android.injected.signing.key.alias").orNull ?: System.getenv("VECTRAS_RELEASE_KEY_ALIAS")
    def releaseKeyPassword = providers.gradleProperty("android.injected.signing.key.password").orNull ?: System.getenv("VECTRAS_RELEASE_KEY_PASSWORD")

    signingConfigs {
        if (releaseStoreFile && releaseStorePassword && releaseKeyAlias && releaseKeyPassword) {
            release {
                storeFile file(releaseStoreFile)
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
    }

def ciRelease = providers.gradleProperty("ciRelease").map { it.toBoolean() }.orElse(false).get()
def releaseSigningMode = providers.gradleProperty("signing_mode")
        .orElse(providers.gradleProperty("SIGNING_MODE").orElse("auto"))
        .get()
        .trim()
        .toLowerCase()
def supportedSigningModes = ['auto', 'signed', 'unsigned'] as Set<String>
if (!(releaseSigningMode in supportedSigningModes)) {
    throw new GradleException("signing_mode inválido: '${releaseSigningMode}'. Valores válidos: ${supportedSigningModes}.")
}
def effectiveSignedRelease = (releaseSigningMode == 'signed') || (releaseSigningMode == 'auto' && ciRelease)
def effectiveUnsignedRelease = (releaseSigningMode == 'unsigned')
project.ext.set("releaseSigningModeResolved", releaseSigningMode)
project.ext.set("effectiveUnsignedRelease", effectiveUnsignedRelease)
project.ext.set("effectiveSignedRelease", effectiveSignedRelease)
def officialCi = providers.gradleProperty("OFFICIAL_CI")
    .orElse(System.getenv("GITHUB_ACTIONS") == "true" ? "true" : "false")
    .get()
    .toBoolean()
def ciInternalValidationEnabled = providers.gradleProperty("CI_INTERNAL_VALIDATION").orElse("false").get().toBoolean()
def requestedTaskNames = gradle.startParameter.taskNames.collect { it.toLowerCase() }
def releaseLikeRequested = requestedTaskNames.any { taskName ->
    taskName.contains("release") || taskName.contains("perfrelease")
}
def debugLikeRequested = requestedTaskNames.isEmpty() || requestedTaskNames.any { taskName ->
    taskName.contains("debug")
}
def strictValidationReasons = []
if (releaseLikeRequested) {
    strictValidationReasons << "variant release/perfRelease requisitada"
}
if (ciRelease) {
    strictValidationReasons << "ciRelease=true"
}
if (releaseSigningMode == 'signed') {
    strictValidationReasons << "signing_mode=signed"
}
if (officialCi) {
    strictValidationReasons << "CI oficial detectada"
}
def strictValidationRequired = !strictValidationReasons.isEmpty()
def allowLocalHeavyValidationBypass = devFastPath && !strictValidationRequired
project.ext.set("allowLocalHeavyValidationBypass", allowLocalHeavyValidationBypass)
def buildExecutionMode = "debug-local"
if (strictValidationRequired && (releaseSigningMode == 'signed' || ciRelease || officialCi)) {
    buildExecutionMode = "release-signed-official"
} else if (strictValidationRequired) {
    buildExecutionMode = "release-unsigned-internal"
} else if (ciInternalValidationEnabled || !debugLikeRequested) {
    buildExecutionMode = "debug-internal-arm32-arm64"
}

def gateLog = { String cls, String message ->
    logger.lifecycle("[${cls}] ${message}")
}

gateLog("ENV", "devFastPath=${devFastPath}, officialCi=${officialCi}, ciRelease=${ciRelease}, requestedTasks=${gradle.startParameter.taskNames}")
gateLog("CONFIG", "signing_mode=${releaseSigningMode}, strictValidationRequired=${strictValidationRequired}, mode=${buildExecutionMode}, ciInternalValidation=${ciInternalValidationEnabled}")
gateLog("SIGNING", strictValidationRequired
    ? "Validação estrita mantida (${strictValidationReasons.join(' | ')})."
    : "Validação estrita não requerida para trilha local.")
if (allowLocalHeavyValidationBypass) {
    gateLog("DEGRADE", "[CONTROLLED] devFastPath=true aplicou degradação somente de gates pesados de pré-build local (ABI_CONTRACT/BOOTSTRAP).")
}
if (devFastPath && strictValidationRequired) {
    gateLog("DEGRADE", "[IGNORED] devFastPath=true foi ignorado porque a trilha '${buildExecutionMode}' exige validação estrita.")
}
gateLog("ABI_CONTRACT", allowLocalHeavyValidationBypass
    ? "Gate degradado (modo local): pré-validação pesada de ABI/freestanding foi desativada."
    : "Contrato ABI/freestanding permanece ativo.")
if ((rootProject.ext.appAbiPolicy ?: '').toString() == 'arm32-debug' && (releaseLikeRequested || ciRelease || releaseSigningMode == 'signed')) {
    throw new GradleException("APP_ABI_POLICY=arm32-debug é somente debug/beta interno; proibido com release, ciRelease=true ou signing_mode=signed.")
}

gateLog("BOOTSTRAP", allowLocalHeavyValidationBypass
    ? "Gate degradado (modo local): validações pesadas de bootstrap/shell-loader foram desativadas."
    : "Validações de bootstrap/shell-loader permanecem ativas.")

    buildTypes {
        release {
            if (signingConfigs.findByName('release') != null) {
                signingConfig = signingConfigs.release
            } else if (effectiveSignedRelease) {
                throw new GradleException("buildTypes.release exige signingConfigs.release quando -PciRelease=true (contexto de distribuição).")
            } else {
                logger.lifecycle("Release signing não configurado fora de distribuição (ciRelease=false ou signing_mode=unsigned).")
            }
            minifyEnabled = true
            shrinkResources = true
            proguardFiles(getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro')
            buildConfigField "boolean", "VECTRA_CORE_ENABLED", "true"
        }
        debug {
            minifyEnabled = false
            proguardFiles(getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro')
            buildConfigField "boolean", "VECTRA_CORE_ENABLED", "true"
        }
        perfRelease {
            initWith release
            matchingFallbacks = ['release']
            if (signingConfigs.findByName('release') != null) {
                signingConfig = signingConfigs.release
            } else if (effectiveSignedRelease) {
                throw new GradleException("buildTypes.perfRelease exige signingConfigs.release quando -PciRelease=true (contexto de distribuição).")
            }
        }
    }

    buildFeatures {
        viewBinding = true
        buildConfig = true
        aidl = true
    }

    splits {
        abi {
            enable = false
        }
    }

    lint {
        checkReleaseBuilds = false
        abortOnError = false
    }

    // Note: Using Java 17 for CI compatibility
    // GitHub Actions runners currently support Java 17 by default
    // If using Java 21 features locally, consider updating CI to Java 21
    compileOptions {
        sourceCompatibility JavaVersion.toVersion(rootProject.ext.javaLanguageVersion)
        targetCompatibility JavaVersion.toVersion(rootProject.ext.javaLanguageVersion)
    }


    externalNativeBuild {
        cmake {
            path = file("src/main/cpp/CMakeLists.txt")
            version = rootProject.ext.cmakeVersion
        }
    }

    kotlinOptions {
        jvmTarget = String.valueOf(rootProject.ext.javaLanguageVersion)
    }

    sourceSets {
        main.assets.srcDir(layout.buildDirectory.dir("generated/bootstrapAssets"))
    }
}

def loaderVariant = (providers.gradleProperty("loaderVariant").orElse("release").get() ?: "release").trim()
if (!loaderVariant) {
    loaderVariant = "release"
}
def normalizedLoaderVariant = loaderVariant.toLowerCase(Locale.ROOT)
def loaderVariantTaskSuffix = loaderVariant.substring(0, 1).toUpperCase(Locale.ROOT) + loaderVariant.substring(1)
def shellLoaderAssembleTask = ":shell-loader:assemble${loaderVariantTaskSuffix}"
def generatedBootstrapDir = layout.buildDirectory.dir("generated/bootstrapAssets/bootstrap")
def verifyShellLoaderManifest = Boolean.parseBoolean(providers.gradleProperty("verifyShellLoaderManifest").orElse("false").get())

evaluationDependsOn(":shell-loader")
def shellLoaderProject = project(":shell-loader")
def shellLoaderVariantApkProviders = shellLoaderProject.ext.has("shellLoaderVariantApkProviders") ? shellLoaderProject.ext.shellLoaderVariantApkProviders : null

def resolveShellLoaderArtifactFromVariant = {
    if (!(shellLoaderVariantApkProviders instanceof Map)) {
        throw new GradleException("[CONFIG] :shell-loader não publicou mapa de artefatos por variante via AGP. Verifique shell-loader/build.gradle (androidComponents/onVariants).")
    }
    def artifactProvider = shellLoaderVariantApkProviders[normalizedLoaderVariant]
    def conventionalPath = shellLoaderProject.layout.buildDirectory.file("outputs/apk/${normalizedLoaderVariant}/loader.apk").get().asFile

    if (artifactProvider == null) {
        def discoveredVariants = shellLoaderVariantApkProviders.keySet().sort()
        throw new GradleException("[CONFIG] Variante '${loaderVariant}' não encontrada em :shell-loader. Variantes disponíveis: ${discoveredVariants}. " +
            "Procura realizada via AGP artifacts API e caminho convencional '${conventionalPath.absolutePath}'. " +
            "Corrija com -PloaderVariant=<${discoveredVariants.join('|')}> e execute '${shellLoaderAssembleTask}'.")
    }

    def artifactCandidate = artifactProvider.get().asFile
    if (!artifactCandidate.exists()) {
        throw new GradleException("[CONFIG] Artifact do shell-loader ausente para variante '${loaderVariant}'. " +
            "Procurado em '${artifactCandidate.absolutePath}' (AGP artifacts API) e fallback '${conventionalPath.absolutePath}'. " +
            "Corrija com -PloaderVariant=${normalizedLoaderVariant} e execute '${shellLoaderAssembleTask}'.")
    }

    if (artifactCandidate.isFile()) {
        return artifactCandidate
    }

    def fileCandidates = [
        new File(artifactCandidate, "loader.apk"),
        new File(artifactCandidate, "app-${normalizedLoaderVariant}.apk"),
        conventionalPath
    ].findAll { it != null }

    def resolvedFile = fileCandidates.find { it.exists() && it.isFile() }
    if (resolvedFile == null) {
        throw new GradleException("[CONFIG] Artifact provider do shell-loader retornou diretório sem APK resolvível para variante '${loaderVariant}': '${artifactCandidate.absolutePath}'. " +
            "Tentativas: ${fileCandidates*.absolutePath}.")
    }
    resolvedFile
}

tasks.register("verifyShellLoaderArtifact") {
    group = "verification"
    description = "Valida loader.apk da variant do shell-loader antes da sincronização para bootstrap."
    dependsOn(shellLoaderAssembleTask)
    onlyIf {
        if (project.findProperty("allowLocalHeavyValidationBypass")?.toString()?.toBoolean()) {
            gateLog("BOOTSTRAP", "Pulando verifyShellLoaderArtifact (devFastPath=true e sem gatilhos estritos).")
            return false
        }
        true
    }

    doLast {
        def artifactFile = resolveShellLoaderArtifactFromVariant()
        def failMessage = { String reason ->
            throw new GradleException("Shell loader artifact inválido para variante '${loaderVariant}' em '${artifactFile.absolutePath}': ${reason}. " +
                "Procura via AGP artifacts API em :shell-loader e fallback '${shellLoaderProject.layout.buildDirectory.file("outputs/apk/${normalizedLoaderVariant}/loader.apk").get().asFile.absolutePath}'. " +
                "Corrija com -PloaderVariant=${normalizedLoaderVariant} e execute '${shellLoaderAssembleTask}'.")
        }

        if (!artifactFile.exists()) {
            failMessage("arquivo não encontrado")
        }

        if (!artifactFile.isFile()) {
            failMessage("caminho não aponta para arquivo regular")
        }

        if (artifactFile.length() <= 0L) {
            failMessage("arquivo vazio (tamanho <= 0 bytes)")
        }

        if (verifyShellLoaderManifest) {
            def manifestEntry = zipTree(artifactFile).matching {
                include "AndroidManifest.xml"
            }.files
            if (manifestEntry.isEmpty()) {
                failMessage("AndroidManifest.xml ausente dentro do APK")
            }
        }
    }
}

tasks.register("syncShellLoaderBootstrap") {
    group = "build setup"
    description = "Copia shell-loader (${loaderVariant}) para assets intermediários em bootstrap/loader.apk."
    dependsOn(tasks.named("verifyShellLoaderArtifact"))
    onlyIf {
        if (project.findProperty("allowLocalHeavyValidationBypass")?.toString()?.toBoolean()) {
            gateLog("BOOTSTRAP", "Pulando syncShellLoaderBootstrap (cadeia de shell-loader desativada para trilha local rápida).")
            return false
        }
        true
    }

    doLast {
        def artifactFile = resolveShellLoaderArtifactFromVariant()
        def destinationDir = generatedBootstrapDir.get().asFile
        destinationDir.mkdirs()
        copy {
            from(artifactFile)
            into(destinationDir)
            rename { "loader.apk" }
        }
    }
}

tasks.named("preBuild").configure {
    dependsOn(tasks.named("syncShellLoaderBootstrap"))
    dependsOn(tasks.named("validateCriticalNativeAbiLayer"))
    dependsOn(tasks.named("validateJniBootstrapZipSignature"))
}

def resolvePythonCommandLine = {
    def candidates = [] as List<String>
    def fromGradleProp = providers.gradleProperty("vectraPython").orNull
    if (fromGradleProp != null && fromGradleProp.trim()) {
        candidates.add(fromGradleProp.trim())
    }
    def fromEnv = System.getenv("PYTHON")
    if (fromEnv != null && fromEnv.trim()) {
        candidates.add(fromEnv.trim())
    }
    def fromEnv3 = System.getenv("PYTHON3")
    if (fromEnv3 != null && fromEnv3.trim()) {
        candidates.add(fromEnv3.trim())
    }
    candidates.addAll(["python3", "python"])
    def seen = new LinkedHashSet<String>()
    for (candidate in candidates) {
        if (!candidate || !seen.add(candidate)) {
            continue
        }
        try {
            def result = exec {
                commandLine candidate, "--version"
                standardOutput = new ByteArrayOutputStream()
                errorOutput = new ByteArrayOutputStream()
                ignoreExitValue = true
            }
            if (result.exitValue == 0) {
                return candidate
            }
        } catch (Exception ignored) {
        }
    }
    throw new GradleException("Nenhum interpretador Python encontrado. Defina -PvectraPython=/caminho/python3 ou variável de ambiente PYTHON/PYTHON3.")
}

tasks.register("validateJniBootstrapZipSignature", Exec) {
    group = "verification"
    description = "Valida assinatura ZIP (PK) do payload JNI quando TERMUX_BOOTSTRAP_MODE=embedded-zip."
    workingDir = rootDir
    doFirst {
        def pythonCmd = resolvePythonCommandLine()
        logger.lifecycle("validateJniBootstrapZipSignature: usando interpretador Python '${pythonCmd}'.")
        commandLine pythonCmd, "tools/ci/validate_jni_bootstrap_payload_signature.py",
            "--mode", providers.gradleProperty("TERMUX_BOOTSTRAP_MODE").orElse("assets-loader").get(),
            "--payload", "app/src/main/cpp/generated/termux_bootstrap_payload.c",
            "--payload", "app/src/main/cpp/generated/termux_bootstrap_payload.S"
    }
}


tasks.register("validateCriticalNativeAbiLayer", Exec) {
    group = "verification"
    description = "Valida contrato lowlevel ABI consolidado (schema, símbolos e política freestanding)."
    workingDir = rootDir
    commandLine "bash", "tools/ci/validate_lowlevel_abi.sh"
    onlyIf {
        if (project.findProperty("allowLocalHeavyValidationBypass")?.toString()?.toBoolean()) {
            gateLog("ABI_CONTRACT", "Pulando validateCriticalNativeAbiLayer (freestanding/ABI pesado) por devFastPath local.")
            return false
        }
        true
    }
}


def checkVariant = (providers.gradleProperty("checkVariant").orElse("debug").get() ?: "debug").trim()
if (!checkVariant) {
    logger.lifecycle("checkVariant vazio detectado; aplicando fallback determinístico para 'debug'.")
    checkVariant = "debug"
}

def checkVariantTaskSuffix = checkVariant.substring(0, 1).toUpperCase() + checkVariant.substring(1)
def checkVariantAssembleTask = "assemble${checkVariantTaskSuffix}"
def termuxBootstrapLibName = "libtermux-bootstrap.so"
def supportedAppAbiPolicies = ['arm64-only', 'arm32-arm64', 'arm32-debug', 'internal-4abi', 'internal-5abi'] as Set<String>
def abiPoliciesThatRequireTermuxBootstrap = java.util.Collections.unmodifiableSet(['arm64-only', 'arm32-arm64', 'internal-4abi'] as LinkedHashSet<String>)

tasks.register("verifyTermuxBootstrapAbiCoverage") {
    group = "verification"
    description = "Falha se SUPPORTED_ABIS incluir ABI fora da matriz oficial/política ativa ou sem ${termuxBootstrapLibName} no APK da variant selecionada."

    dependsOn(":app:${checkVariantAssembleTask}")
    dependsOn(tasks.named("verifyTermuxBootstrapPackagingRules"))

    doLast {
        def supportedAbis = (rootProject.ext.supportedAbis ?: []) as List<String>
        def officialAbis = (rootProject.ext.officialAbis ?: []) as List<String>
        def allowedAbis = (rootProject.ext.allowedAbis ?: officialAbis) as List<String>
        def appAbiPolicy = (rootProject.ext.appAbiPolicy ?: "").toString()
        def unknownAbis = supportedAbis.findAll { !(it in allowedAbis) }

        if (!unknownAbis.isEmpty()) {
            throw new GradleException("SUPPORTED_ABIS contém ABIs fora da matriz permitida: ${unknownAbis}. Matriz permitida: ${allowedAbis}.")
        }

        switch (appAbiPolicy) {
            case "arm64-only":
                if (supportedAbis != ['arm64-v8a']) {
                    throw new GradleException("APP_ABI_POLICY=arm64-only exige SUPPORTED_ABIS=arm64-v8a (atual: ${supportedAbis}).")
                }
                break
            case "arm32-arm64":
                def expectedDualArmAbis = ['arm64-v8a', 'armeabi-v7a']
                if (!ciInternalValidationEnabled) {
                    throw new GradleException("APP_ABI_POLICY=arm32-arm64 exige CI_INTERNAL_VALIDATION=true para impedir uso acidental fora da trilha interna.")
                }
                if (supportedAbis != expectedDualArmAbis) {
                    throw new GradleException("APP_ABI_POLICY=arm32-arm64 exige SUPPORTED_ABIS=${expectedDualArmAbis} (atual: ${supportedAbis}).")
                }
                break
            case "arm32-debug":
                if (!ciInternalValidationEnabled) {
                    throw new GradleException("APP_ABI_POLICY=arm32-debug exige CI_INTERNAL_VALIDATION=true para beta/debug interno.")
                }
                if (supportedAbis != ['armeabi-v7a']) {
                    throw new GradleException("APP_ABI_POLICY=arm32-debug exige SUPPORTED_ABIS=armeabi-v7a (atual: ${supportedAbis}).")
                }
                if (releaseLikeRequested || ciRelease || releaseSigningMode == 'signed') {
                    throw new GradleException("APP_ABI_POLICY=arm32-debug é proibido para release, ciRelease=true ou signing_mode=signed.")
                }
                break
            case "internal-5abi":
                def expectedAbis = (rootProject.ext.internalValidationAbis ?: []) as List<String>
                if (!ciInternalValidationEnabled) {
                    throw new GradleException("APP_ABI_POLICY=internal-5abi exige CI_INTERNAL_VALIDATION=true para execução.")
                }
                if (supportedAbis != expectedAbis) {
                    throw new GradleException("APP_ABI_POLICY=internal-5abi exige SUPPORTED_ABIS=${expectedAbis} (atual: ${supportedAbis}).")
                }
                break
            case "internal-4abi":
                def expectedAppAbis = (rootProject.ext.internalValidationAppAbis ?: []) as List<String>
                if (!ciInternalValidationEnabled) {
                    throw new GradleException("APP_ABI_POLICY=internal-4abi exige CI_INTERNAL_VALIDATION=true para execução.")
                }
                if (supportedAbis != expectedAppAbis) {
                    throw new GradleException("APP_ABI_POLICY=internal-4abi exige SUPPORTED_ABIS=${expectedAppAbis} (atual: ${supportedAbis}).")
                }
                break
            default:
                throw new GradleException("[ABI_CONTRACT] APP_ABI_POLICY inválida: '${appAbiPolicy}'. Políticas suportadas: ${supportedAppAbiPolicies}.")
        }

        if (appAbiPolicy in abiPoliciesThatRequireTermuxBootstrap) {
            def unsupportedByBootstrap = supportedAbis.findAll { !(it in termuxBootstrapSupportedAbis) }
            if (!unsupportedByBootstrap.isEmpty()) {
                throw new GradleException("termux-bootstrap não suporta ABIs solicitadas em SUPPORTED_ABIS: ${unsupportedByBootstrap}. ABIs válidas para termux-bootstrap: ${termuxBootstrapSupportedAbis}.")
            }
        }

        def apkDir = file("${buildDir}/outputs/apk/${checkVariant}")
        def apkFiles = fileTree(apkDir) {
            include "**/*.apk"
        }.files.sort { it.name }

        if (apkFiles.isEmpty()) {
            throw new GradleException("Nenhum APK encontrado para variant ${checkVariant} em ${apkDir}.")
        }

        def missingByApk = [:].withDefault { [] }
        apkFiles.each { apkFile ->
            def zipFile = new java.util.zip.ZipFile(apkFile)
            try {
                def requiredBootstrapAbis = appAbiPolicy in abiPoliciesThatRequireTermuxBootstrap ? supportedAbis : []
                requiredBootstrapAbis.each { abi ->
                    def entryPath = "lib/${abi}/${termuxBootstrapLibName}"
                    if (zipFile.getEntry(entryPath) == null) {
                        missingByApk[apkFile.name] << entryPath
                    }
                }
            } finally {
                zipFile.close()
            }
        }

        if (!missingByApk.isEmpty()) {
            def rendered = missingByApk.collect { apkName, missingEntries ->
                "${apkName}: ${missingEntries}"
            }.join(" | ")
            throw new GradleException("Cobertura ABI inválida para termux-bootstrap. Entradas ausentes: ${rendered}.")
        }

        logger.lifecycle("[verifyTermuxBootstrapAbiCoverage] variant=${checkVariant}, APP_ABI_POLICY=${appAbiPolicy}, SUPPORTED_ABIS=${supportedAbis} com ${termuxBootstrapLibName} presente para todas as ABIs.")
    }
}


def rafStrictAuditClaims = providers.environmentVariable("RAF_STRICT_AUDIT_CLAIMS").orElse("false").get().toBoolean()
def rafRequireDeviceRuntime = providers.environmentVariable("RAF_REQUIRE_DEVICE_RUNTIME").orElse("false").get().toBoolean()
def rafEnableVectraBench = providers.environmentVariable("RAF_ENABLE_VECTRA_BENCH").orElse("true").get().toBoolean()
def rafRequireRmrEquivalence = providers.environmentVariable("RAF_REQUIRE_RMR_EQUIVALENCE").orElse("false").get().toBoolean()

tasks.register('validateAuditClaims', Exec) {
    commandLine 'bash', './scripts/validate_audit_claims.sh'
    ignoreExitValue = !rafStrictAuditClaims
}

tasks.register('collectVectraGradeBenchmarks', Exec) {
    onlyIf { rafEnableVectraBench }
    commandLine 'bash', './scripts/collect_vectra_grade_benchmarks.sh'
}

tasks.register('validateRmrEquivalence', Exec) {
    commandLine 'bash', './scripts/rmr_equivalence_check.sh'
    ignoreExitValue = !rafRequireRmrEquivalence
}

tasks.register('deviceRuntimeSmoke', Exec) {
    commandLine 'bash', './scripts/device_runtime_smoke.sh'
    ignoreExitValue = !rafRequireDeviceRuntime
}

tasks.register("verifyDeliveredCompiledArtifacts") {
    group = "verification"
    description = "Valida se os artefatos compilados esperados (APK/AAB) foram gerados e emite relatório JSON para entrega."

    doLast {
        def readGradleOrEnv = { String gradleKey, String envKey, String fallback ->
            def fromGradle = providers.gradleProperty(gradleKey).orNull
            if (fromGradle != null && !fromGradle.toString().trim().isEmpty()) {
                return fromGradle.toString().trim()
            }
            def fromEnv = System.getenv(envKey)
            if (fromEnv != null && !fromEnv.toString().trim().isEmpty()) {
                return fromEnv.toString().trim()
            }
            return fallback
        }
        def sha256Hex = { byte[] bytes ->
            MessageDigest digest = MessageDigest.getInstance("SHA-256")
            byte[] hash = digest.digest(bytes)
            return hash.collect { String.format("%02x", it) }.join("")
        }
        def sha256File = { File inputFile ->
            MessageDigest digest = MessageDigest.getInstance("SHA-256")
            inputFile.withInputStream { is ->
                byte[] buffer = new byte[8192]
                int read = 0
                while ((read = is.read(buffer)) > 0) {
                    digest.update(buffer, 0, read)
                }
            }
            return digest.digest().collect { String.format("%02x", it) }.join("")
        }
        def toolAvailable = { String toolName ->
            def output = new ByteArrayOutputStream()
            def result = exec {
                commandLine("bash", "-lc", "command -v ${toolName}")
                standardOutput = output
                errorOutput = new ByteArrayOutputStream()
                ignoreExitValue = true
            }
            return result.exitValue == 0 && !output.toString().trim().isEmpty()
        }
        def runToolEvidence = { List<String> commandLineArgs ->
            def output = new ByteArrayOutputStream()
            def result = exec {
                commandLine(commandLineArgs)
                standardOutput = output
                errorOutput = output
                ignoreExitValue = true
            }
            return [exitCode: result.exitValue, output: output.toString("UTF-8").trim()]
        }
        def helperScript = file("${rootProject.projectDir}/tools/ci/collect_elf_evidence.py")
        def hasElfEvidenceHelper = helperScript.exists()

        def requestedVariantsRaw = (providers.gradleProperty("artifactVariants")
            .orElse("debug,release,perfRelease")
            .get() ?: "debug,release,perfRelease")
        def requestedVariants = requestedVariantsRaw
            .split(',')
            .collect { it.trim() }
            .findAll { !it.isEmpty() }
            .unique()

        if (requestedVariants.isEmpty()) {
            throw new GradleException("Nenhuma variant informada em -PartifactVariants. Informe ao menos uma variant (ex.: debug,release).")
        }

        def reportVariants = []
        def missingVariants = []
        def manifestFiles = []
        def evidenceReports = []
        def internalLaneAbiMissingByVariant = []
        def supportedAbis = (rootProject.ext.supportedAbis ?: []) as List<String>
        def appAbiPolicy = (rootProject.ext.appAbiPolicy ?: providers.gradleProperty("APP_ABI_POLICY").orElse("").get()).toString()
        def abiProfile = readGradleOrEnv("abi_profile", "ABI_PROFILE", "unknown")
        def workflowName = readGradleOrEnv("workflow", "GITHUB_WORKFLOW", "local")
        def laneName = readGradleOrEnv("lane", "CI_LANE", "android")
        def signingMode = readGradleOrEnv("signing_mode", "SIGNING_MODE", "auto")
        def repositoryId = readGradleOrEnv("repo", "GITHUB_REPOSITORY", rootProject.name)
        def commitSha = readGradleOrEnv("commit", "GITHUB_SHA", "unknown")
        def hasFileTool = toolAvailable("file")
        def hasReadelfTool = toolAvailable("readelf")
        def internalLane = abiProfile.startsWith("internal_") || appAbiPolicy.startsWith("internal-") || laneName.toLowerCase(Locale.ROOT).contains("internal")

        requestedVariants.each { variant ->
            def apkDir = file("${buildDir}/outputs/apk/${variant}")
            def bundleDir = file("${buildDir}/outputs/bundle/${variant}")
            def variantManifestFiles = []

            def apkFiles = fileTree(apkDir) {
                include "**/*.apk"
            }.files.sort { it.name }

            def bundleFiles = fileTree(bundleDir) {
                include "**/*.aab"
            }.files.sort { it.name }

            def artifacts = (apkFiles + bundleFiles).collect { artifact ->
                def zipFile = new ZipFile(artifact)
                def artifactEntries = []
                def libsByAbi = [:].withDefault { [] }
                try {
                    zipFile.entries().findAll { entry ->
                        !entry.isDirectory() && entry.name ==~ /^lib\/[^\/]+\/.+\.so$/
                    }.each { entry ->
                        def matcher = (entry.name =~ /^lib\/([^\/]+)\/.+\.so$/)
                        def abi = matcher.matches() ? matcher.group(1) : "unknown"
                        def bytes = zipFile.getInputStream(entry).bytes
                        def sha256 = sha256Hex(bytes)
                        def evidenceParts = []
                        def tempSo = File.createTempFile("abi-evidence-", ".so")
                        tempSo.deleteOnExit()
                        tempSo.bytes = bytes
                        try {
                            if (hasFileTool) {
                                def fileResult = runToolEvidence(["file", tempSo.absolutePath])
                                if (fileResult.exitCode == 0 && fileResult.output) {
                                    evidenceParts << "file=${fileResult.output}"
                                }
                            }
                            if (hasReadelfTool) {
                                def readelfResult = runToolEvidence(["readelf", "-h", tempSo.absolutePath])
                                if (readelfResult.exitCode == 0 && readelfResult.output) {
                                    def archLine = readelfResult.output.readLines().findAll {
                                        it.contains("Class:") || it.contains("Machine:")
                                    }.join(" | ")
                                    if (!archLine.isEmpty()) {
                                        evidenceParts << "readelf=${archLine}"
                                    }
                                }
                            }
                            if (hasElfEvidenceHelper) {
                                def helperResult = runToolEvidence(["python3", helperScript.absolutePath, tempSo.absolutePath])
                                if (helperResult.exitCode == 0 && helperResult.output) {
                                    try {
                                        def parsed = new groovy.json.JsonSlurper().parseText(helperResult.output)
                                        evidenceReports << [
                                            artifact : artifact.name,
                                            variant  : variant,
                                            abi      : abi,
                                            soPath   : entry.name,
                                            evidence : parsed
                                        ]
                                    } catch (Exception ignored) {
                                        evidenceParts << "helper=parse_error"
                                    }
                                } else {
                                    evidenceParts << "helper=failed(exit=${helperResult.exitCode})"
                                }
                            }
                        } finally {
                            tempSo.delete()
                        }

                        def evidenceText = evidenceParts.isEmpty() ? "unavailable:file/readelf not found or failed" : evidenceParts.join(" || ")
                        def entryInfo = [
                            path    : entry.name,
                            size    : entry.size,
                            sha256  : sha256,
                            abi     : abi,
                            evidence: evidenceText
                        ]
                        artifactEntries << entryInfo
                        libsByAbi[abi] << entryInfo
                    }
                } finally {
                    zipFile.close()
                }
                variantManifestFiles.addAll(artifactEntries)
                def presentAbis = libsByAbi.keySet().toList().sort()
                def missingSupportedAbis = supportedAbis.findAll { !(it in presentAbis) }
                def artifactRecord = [
                    name                  : artifact.name,
                    type                  : artifact.name.endsWith(".aab") ? "AAB" : "APK",
                    variant               : variant,
                    size_bytes            : artifact.length(),
                    sha256                : sha256File(artifact),
                    path                  : rootProject.projectDir.toPath().relativize(artifact.toPath()).toString(),
                    jni_libs_by_abi       : libsByAbi.collectEntries { abiName, values -> [(abiName): values.sort { a, b -> a.path <=> b.path }] },
                    present_abis          : presentAbis,
                    missing_supported_abis: missingSupportedAbis
                ]
                manifestFiles << artifactRecord
                [
                    name       : artifactRecord.name,
                    type       : artifactRecord.type,
                    sizeBytes  : artifactRecord.size_bytes,
                    sha256     : artifactRecord.sha256,
                    path       : artifactRecord.path,
                    abiEntries : artifactEntries.size(),
                    presentAbis: artifactRecord.present_abis,
                    missingAbis: artifactRecord.missing_supported_abis
                ]
            }

            if (artifacts.isEmpty()) {
                missingVariants << variant
            }

            if (internalLane && !supportedAbis.isEmpty()) {
                def variantAbiSet = (variantManifestFiles*.abi).toSet()
                def missingExpectedAbis = supportedAbis.findAll { !(it in variantAbiSet) }
                if (!missingExpectedAbis.isEmpty()) {
                    internalLaneAbiMissingByVariant << [variant: variant, missingAbis: missingExpectedAbis]
                }
            }

            reportVariants << [
                variant   : variant,
                artifactCount: artifacts.size(),
                artifacts : artifacts
            ]
        }

        def report = [
            generatedAtUtc: new Date().format("yyyy-MM-dd'T'HH:mm:ss'Z'", TimeZone.getTimeZone("UTC")),
            project       : project.path,
            variants      : reportVariants,
            elfEvidence   : evidenceReports
        ]

        def reportFile = file("${buildDir}/reports/artifacts/compiled-artifacts-report.json")
        reportFile.parentFile.mkdirs()
        reportFile.text = JsonOutput.prettyPrint(JsonOutput.toJson(report))

        def manifest = [
            repo            : repositoryId,
            commit          : commitSha,
            workflow        : workflowName,
            lane            : laneName,
            abi_profile     : abiProfile,
            app_abi_policy  : appAbiPolicy,
            supported_abis  : supportedAbis,
            build_variant   : requestedVariants.join(","),
            signing_mode    : signingMode,
            files           : manifestFiles.sort { a, b -> a.path <=> b.path ?: a.sha256 <=> b.sha256 },
            elf_evidence    : evidenceReports
        ]

        def manifestFile = file("${buildDir}/reports/artifacts/artifact-manifest.json")
        manifestFile.parentFile.mkdirs()
        manifestFile.text = JsonOutput.prettyPrint(JsonOutput.toJson(manifest))

        if (!missingVariants.isEmpty()) {
            throw new GradleException("Artefatos compilados ausentes para variants=${missingVariants}. Execute assemble correspondente antes de validar. Relatório: ${reportFile}")
        }
        if (!internalLaneAbiMissingByVariant.isEmpty()) {
            def details = internalLaneAbiMissingByVariant.collect { "variant=${it.variant} missing=${it.missingAbis}" }.join("; ")
            throw new GradleException("[ABI_CONTRACT] ABI esperada ausente na trilha interna: ${details}. Manifesto: ${manifestFile}")
        }

        logger.lifecycle("[verifyDeliveredCompiledArtifacts] Relatório gerado em ${reportFile}")
        logger.lifecycle("[verifyDeliveredCompiledArtifacts] Manifesto gerado em ${manifestFile} com ${manifestFiles.size()} artefatos e ${evidenceReports.size()} evidências ELF")
        reportVariants.each { entry ->
            logger.lifecycle("[verifyDeliveredCompiledArtifacts] variant=${entry.variant} artifacts=${entry.artifactCount}")
        }
    }
}

def globToRegex = { String glob ->
    def escaped = Pattern.quote(glob)
        .replace("\\*\\*", "__GLOBSTAR__")
        .replace("\\*", "__GLOB__")
        .replace("\\?", "__QMARK__")

    return "^${escaped
        .replace("__GLOBSTAR__", ".*")
        .replace("__GLOB__", "[^/]*")
        .replace("__QMARK__", ".")}\$"
}

tasks.register("verifyTermuxBootstrapPackagingRules") {
    group = "verification"
    description = "Falha se alguma regra de packaging.jniLibs.excludes remover lib/<abi>/libtermux-bootstrap.so para ABIs suportadas."

    doLast {
        def supportedAbis = (rootProject.ext.supportedAbis ?: []) as List<String>
        def officialAbis = (rootProject.ext.officialAbis ?: []) as List<String>
        def allowedAbis = (rootProject.ext.allowedAbis ?: officialAbis) as List<String>
        def appAbiPolicy = (rootProject.ext.appAbiPolicy ?: "").toString()
        def excludes = (android.packaging.jniLibs.excludes ?: [] as Set<String>).collect { it.toString() }

        if (!(appAbiPolicy in supportedAppAbiPolicies)) {
            throw new GradleException("[ABI_CONTRACT] APP_ABI_POLICY inválida: '${appAbiPolicy}'. Políticas suportadas: ${supportedAppAbiPolicies}.")
        }

        if (!supportedAbis.every { it in allowedAbis }) {
            throw new GradleException("SUPPORTED_ABIS (${supportedAbis}) contém ABI fora da matriz permitida (${allowedAbis}).")
        }

        if (appAbiPolicy == 'arm32-debug') {
            if (!ciInternalValidationEnabled) {
                throw new GradleException("APP_ABI_POLICY=arm32-debug exige CI_INTERNAL_VALIDATION=true para beta/debug interno.")
            }
            if (supportedAbis != ['armeabi-v7a']) {
                throw new GradleException("APP_ABI_POLICY=arm32-debug exige SUPPORTED_ABIS=armeabi-v7a (atual: ${supportedAbis}).")
            }
            if (releaseLikeRequested || ciRelease || releaseSigningMode == 'signed') {
                throw new GradleException("APP_ABI_POLICY=arm32-debug é proibido para release, ciRelease=true ou signing_mode=signed.")
            }
        }

        if (appAbiPolicy in abiPoliciesThatRequireTermuxBootstrap) {
            def unsupportedByBootstrap = supportedAbis.findAll { !(it in termuxBootstrapSupportedAbis) }
            if (!unsupportedByBootstrap.isEmpty()) {
                throw new GradleException("APP_ABI_POLICY=${appAbiPolicy} exige ABIs compatíveis com termux-bootstrap. Inválidas: ${unsupportedByBootstrap}. Válidas: ${termuxBootstrapSupportedAbis}.")
            }
        }

        def violations = []
        supportedAbis.each { abi ->
            def expectedEntry = "lib/${abi}/libtermux-bootstrap.so"
            excludes.each { pattern ->
                if (expectedEntry ==~ globToRegex(pattern)) {
                    violations << [abi: abi, pattern: pattern]
                }
            }
        }

        if (!violations.isEmpty()) {
            def details = violations.collect { "ABI=${it.abi} bloqueada por exclude='${it.pattern}'" }.join("; ")
            throw new GradleException("packaging.jniLibs.excludes remove indevidamente libtermux-bootstrap.so: ${details}")
        }

        logger.lifecycle("[verifyTermuxBootstrapPackagingRules] Regras de packaging não removem libtermux-bootstrap.so para SUPPORTED_ABIS=${supportedAbis}.")
    }
}



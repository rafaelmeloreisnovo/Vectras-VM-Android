# ═══════════════════════════════════════════════════════════
# qemu_launch.yml — RAFAELIA QEMU Launch Configuration
# ψ = intenção | Ω = Amor (coerência máxima)
# ═══════════════════════════════════════════════════════════

version: "1.1"
project: "Vectras-VM-Android / RAFAELIA"
source_repository: "rafaelmeloreisnovo/qemu_rafaelia"
asset_lock: "tools/qemu_rafaelia_assets.lock.yml"

# Binaries/firmware/rootfs are runtime artifacts, not git-tracked assets.
runtime_paths:
  qemu_bin_dirs:
    - "${filesDir}/distro/usr/local/bin"
    - "${filesDir}/distro/usr/bin"
    - "${filesDir}/usr/bin"
    - "${filesDir}/bin"
    - "${PATH}"
  firmware_dir: "${filesDir}/firmware"
  rootfs_dir: "${filesDir}/distro"

# ── Global defaults ─────────────────────────────────────────
defaults:
  memory_mb: 2048
  cpus: 2
  kvm_preferred: true
  virtio_net: true
  virtio_disk: true
  nographic: true
  serial: "mon:stdio"
  qemu_binary_policy: "runtime-resolved"
  firmware_policy: "external-sha256"
  common_virtio_devices: &common_virtio_devices
    - "-device virtio-balloon"
    - "-device virtio-rng-pci"
  arm64_input_devices: &arm64_input_devices
    - "-device virtio-gpu-pci"
    - "-device virtio-keyboard-pci"
    - "-device virtio-mouse-pci"

# ── Machine profiles ────────────────────────────────────────
profiles:

  x86_64_standard:
    arch: x86_64
    machine: "pc"
    cpu_kvm: host
    cpu_tcg: qemu64
    qemu_binary_candidates:
      - "qemu-system-x86_64-rafaelia"
      - "qemu-system-x86_64-rafacodephi"
      - "qemu-system-x86_64"
    firmware:
      efi: "${filesDir}/firmware/RELEASEX64_OVMF.fd"
      efi_vars: "${filesDir}/firmware/RELEASEX64_OVMF_VARS.fd"
      bios_fallback: "${filesDir}/firmware/bios-vectras.bin"
    accel_priority: [kvm, tcg]
    extra_args: *common_virtio_devices

  arm64_virt:
    arch: aarch64
    machine: "virt"
    machine_opts:
      gic_version: 3
      iommu: "none"
    cpu_kvm: host
    cpu_tcg: cortex-a72
    qemu_binary_candidates:
      - "qemu-system-aarch64-rafaelia"
      - "qemu-system-aarch64-rafacodephi"
      - "qemu-system-aarch64"
    firmware:
      efi: "${filesDir}/firmware/QEMU_EFI.img"
      efi_vars: "${filesDir}/firmware/QEMU_VARS.img"
    accel_priority: [kvm, tcg]
    extra_args: *arm64_input_devices

  arm64_lowmem:
    arch: aarch64
    machine: "virt"
    memory_mb: 512
    cpus: 1
    cpu_tcg: cortex-a53
    qemu_binary_candidates:
      - "qemu-system-aarch64-rafaelia"
      - "qemu-system-aarch64-rafacodephi"
      - "qemu-system-aarch64"
    accel_priority: [tcg]
    nographic: true

  x86_32_compat:
    arch: i386
    machine: "pc"
    memory_mb: 512
    cpus: 1
    qemu_binary_candidates:
      - "qemu-system-i386-rafaelia"
      - "qemu-system-i386-rafacodephi"
      - "qemu-system-i386"
    accel_priority: [tcg]
    firmware:
      bios_fallback: "${filesDir}/firmware/bios-vectras.bin"

# ── SDK/NDK build requirements ──────────────────────────────
build_env:
  ndk_version: "27.2.12479018"
  compile_sdk: 35  # must stay aligned with gradle.properties compile.api/COMPILE_API
  min_sdk: 29      # Android 10+ runtime support floor
  target_sdk: 35   # must stay aligned with gradle.properties target.api/TARGET_API
  cmake_version: "3.22.1"
  java_version: 17
  abi_filters:
    scope: official_distribution
    official_distribution:
      - arm64-v8a
    internal_validation:
      - arm64-v8a
      - armeabi-v7a

# ── RMR engine compile flags ────────────────────────────────
engine_flags:
  common:
    - "-O2"
    - "-fno-fast-math"
    - "-fvisibility=hidden"
    - "-DRMR_JNI_BUILD=1"
    - "-DRMR_BUILD_HOST_TOOLING=1"
  arm64:
    - "-march=armv8-a+crc"
    - "-mabi=lp64"
  x86_64:
    - "-msse4.2"
    - "-mpopcnt"

# ── QEMU QMP telemetry fields ────────────────────────────────
telemetry:
  enable: true
  poll_interval_ms: 1000
  fields:
    - vcpu_count
    - halted_count
    - running_count
    - balloon_actual
    - rafaelia_runtime_ticks
    - rafaelia_entropy_last
    - rafaelia_coherence_last
